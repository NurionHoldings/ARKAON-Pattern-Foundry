[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arkaon-pattern-foundry"
version = "0.1.0"
description = "Evidence-first pattern manufacturing engine for ARKAON"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/apf"]

[tool.hatch.build.targets.wheel.force-include]
"db/migrations" = "apf/sql_migrations"
"src/apf/console_ui.html" = "apf/console_ui.html"
"src/apf/visual_dialogue_ui.html" = "apf/visual_dialogue_ui.html"
"src/apf/reference_material_consent_ui.html" = "apf/reference_material_consent_ui.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
