<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아르카온 시네마틱 게이트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#eef3ff;font-family:system-ui,sans-serif}.apf-gate{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at center,#263b58 0%,#10263c 40%,#050c17 100%)}
.apf-gate:before{content:"";position:absolute;inset:-30%;z-index:-1;background:radial-gradient(ellipse at 45% 50%,#7676cc35,transparent 45%),repeating-linear-gradient(117deg,transparent 0 120px,#8abbff05 121px 123px);animation:apf-atmosphere 12s ease-in-out infinite alternate}
.apf-beam{position:absolute;top:50%;left:-20%;width:140%;height:2px;background:linear-gradient(90deg,transparent,#7887f2,#f5caff,#7887f2,transparent);box-shadow:0 0 16px 5px #ad79ff65;transform:rotate(-3deg);animation:apf-beam 3.8s ease both;pointer-events:none}.apf-beam:after{content:"";position:absolute;inset:-70px 25%;background:radial-gradient(ellipse,#d7a0ff42,transparent 65%)}
.apf-content{text-align:center;z-index:1;padding:24px;width:100%;}.apf-title{margin:0;font-size:clamp(2.6rem,9vw,7rem);line-height:1.15;font-weight:900;letter-spacing:.06em;overflow-wrap:anywhere;background:linear-gradient(#fff4d6 5%,#c9aecb 45%,#fff0d4 52%,#977eaa 95%);background-clip:text;color:transparent;animation:apf-title-unfold 2.3s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 2px 0 #484759) drop-shadow(0 0 18px #d797ff60)}.apf-subtitle{color:#b9cae1;letter-spacing:.17em;font-size:clamp(.85rem,2vw,1.1rem);margin:24px 0 40px}.apf-enter,.apf-skip{cursor:pointer;font:inherit;color:#edf3ff;border:1px solid #a5b4e780;border-radius:8px;background:#152942cc;padding:14px 30px}.apf-enter:hover,.apf-enter:focus-visible{background:#35466b;outline:2px solid #d4b9ff;outline-offset:4px}.apf-skip{position:absolute;right:20px;top:20px;padding:8px 14px}.apf-gate.apf-leaving{animation:apf-exit .65s ease-in forwards;pointer-events:none}.apf-platform{min-height:100svh;padding:clamp(24px,6vw,80px)}[hidden]{display:none!important}
@keyframes apf-title-unfold{0%{opacity:0;clip-path:inset(0 50%);transform:scaleX(.55);letter-spacing:-.08em}15%{opacity:1;clip-path:inset(0 43%)}75%{clip-path:inset(0 0);transform:scaleX(1.025);letter-spacing:.07em}100%{opacity:1;clip-path:inset(0 0);transform:scaleX(1);letter-spacing:.06em}}@keyframes apf-beam{0%{opacity:0;transform:translateX(-25%) rotate(-3deg) scaleX(.3)}35%,70%{opacity:1}100%{opacity:.6;transform:translateX(0) rotate(-3deg) scaleX(1)}}@keyframes apf-atmosphere{to{transform:translate(3%,2%) rotate(3deg)}}@keyframes apf-exit{to{opacity:0;transform:scale(1.08);filter:blur(8px)}}
@media(prefers-reduced-motion:reduce){.apf-gate,.apf-gate:before,.apf-content,.apf-title,.apf-beam,.apf-gate.apf-leaving{animation:none!important}.apf-content{opacity:1;filter:none}}

.apf-title:has(.apf-layered){animation:none;filter:none;background:none;font-size:clamp(1.7rem,6.8vw,6rem);color:#eee3d4}
.apf-layered{display:inline-flex;gap:.26em;perspective:800px;transform-style:preserve-3d;max-width:100%}
.apf-word{display:inline-block;white-space:nowrap;transform-style:preserve-3d;color:#e6d3df;text-shadow:0 2px 0 #716078,0 0 18px #b283dd77;animation-duration:1.2s;animation-timing-function:cubic-bezier(.22,1,.36,1);animation-fill-mode:both;animation-play-state:paused}
.apf-ready .apf-word{animation-play-state:running}
.apf-word-left{position:relative;z-index:3;animation-name:apf-word-left;animation-delay:.4s}
.apf-word-right{position:relative;z-index:2;animation-name:apf-word-right;animation-delay:1.6s}
.apf-word-center{position:relative;z-index:1;animation-name:apf-word-center;animation-delay:2.8s}
@keyframes apf-word-left{from{transform:translateX(var(--apf-offset,0px)) translateZ(80px)}to{transform:translateX(0) translateZ(0)}}
@keyframes apf-word-right{from{transform:translateX(var(--apf-offset,0px)) translateZ(40px)}to{transform:translateX(0) translateZ(0)}}
@keyframes apf-word-center{from{transform:translateX(var(--apf-offset,0px)) translateZ(-40px);color:#847899;text-shadow:0 1px 0 #39354f}to{transform:translateX(0) translateZ(35px);color:#ffe4a1;text-shadow:0 1px 0 #a57739,0 2px 0 #94642e,0 3px 0 #805125,0 4px 0 #684022,0 5px 0 #51311c,0 9px 15px #0009,0 0 25px #ffcc7566}}
@media(prefers-reduced-motion:reduce){.apf-word{animation:none!important;transform:none!important}.apf-word-center{color:#ffe4a1;text-shadow:0 2px 0 #94642e,0 4px 0 #684022}}
:root{--apf-accent:#ad79ff;--apf-background:#071522;--apf-duration:4.0s}
.apf-gate{background:radial-gradient(ellipse at center,#263b58,var(--apf-background) 75%)}
.apf-beam{background:linear-gradient(90deg,transparent,var(--apf-accent),#fff,var(--apf-accent),transparent);box-shadow:0 0 18px var(--apf-accent)}
.apf-title{animation-duration:var(--apf-duration)}
.apf-word{animation-duration:calc(var(--apf-duration)*.3)}
.apf-word-left{animation-delay:calc(var(--apf-duration)*.1)}
.apf-word-right{animation-delay:calc(var(--apf-duration)*.4)}
.apf-word-center{animation-delay:calc(var(--apf-duration)*.7)}
.apf-gate[data-effect="arkaon-iris-reveal"] .apf-content{animation:apf-iris var(--apf-duration) ease both}
.apf-gate[data-effect="arkaon-iris-reveal"] .apf-title{animation:none}
@keyframes apf-iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(100% at 50% 50%)}}
.apf-gate[data-effect="arkaon-curtain-open"]:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--apf-background),#314061,var(--apf-background));animation:apf-curtains var(--apf-duration) ease-in-out both}
.apf-gate[data-effect="arkaon-curtain-open"] .apf-title{animation-name:apf-curtain-title}
.apf-skip{z-index:5}
@keyframes apf-curtains{0%,12%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,50% 0,50% 100%,50% 100%,50% 0)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,0 0,0 100%,100% 100%,100% 0)}}
@keyframes apf-curtain-title{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.apf-gate[data-effect="arkaon-stagger-rise"] .apf-title{animation:none;background:none;color:#eee3d4;filter:none}
.apf-char{display:inline-block;white-space:pre;animation:apf-stagger calc(var(--apf-duration)*.4) cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--apf-duration)*.6*var(--apf-progress))}
@keyframes apf-stagger{from{opacity:0;transform:translateY(1em) rotateX(-65deg)}to{opacity:1;transform:none}}
.apf-gate[data-effect="arkaon-focus-reveal"] .apf-title{animation-name:apf-focus}
@keyframes apf-focus{from{opacity:0;filter:blur(18px);transform:scale(1.12)}to{opacity:1;filter:blur(0);transform:scale(1)}}
.apf-gate[data-effect="arkaon-neon-trace"] .apf-title{background:none;animation-name:apf-neon;-webkit-text-stroke:1px var(--apf-accent)}
@keyframes apf-neon{0%{color:transparent;opacity:0;text-shadow:none}40%{color:transparent;opacity:1;text-shadow:0 0 5px var(--apf-accent)}100%{color:#f4eeff;opacity:1;text-shadow:0 0 12px var(--apf-accent),0 0 28px var(--apf-accent)}}
.apf-gate[data-effect="arkaon-perspective-flip"] .apf-title{animation-name:apf-flip}
@keyframes apf-flip{from{opacity:0;transform:perspective(900px) rotateY(-80deg) translateZ(-100px)}to{opacity:1;transform:perspective(900px) rotateY(0) translateZ(0)}}
.apf-gate[data-effect="arkaon-orbit-halo"]:after{content:"";position:absolute;width:min(70vw,600px);aspect-ratio:1;border:2px solid var(--apf-accent);border-radius:50%;box-shadow:0 0 30px var(--apf-accent);pointer-events:none;animation:apf-orbit var(--apf-duration) ease-out both}
.apf-gate[data-effect="arkaon-orbit-halo"] .apf-title{animation-name:apf-orbit-title}
@keyframes apf-orbit{from{opacity:0;transform:perspective(800px) rotateX(75deg) rotateY(70deg) scale(.4)}to{opacity:.3;transform:perspective(800px) rotateX(55deg) rotateY(-15deg) scale(1)}}
@keyframes apf-orbit-title{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.apf-gate[data-effect="arkaon-scan-reveal"] .apf-title{animation-name:apf-scan}
.apf-gate[data-effect="arkaon-scan-reveal"] .apf-beam{animation:apf-scan-beam var(--apf-duration) linear both;transform:none}
@keyframes apf-scan{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes apf-scan-beam{0%{top:25%;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:75%;opacity:0}}
@media(prefers-reduced-motion:reduce){.apf-content,.apf-title,.apf-char,.apf-word,.apf-gate:after{animation:none!important;opacity:1;clip-path:none;transform:none;filter:none}.apf-gate[data-effect="arkaon-curtain-open"]:after{display:none}.apf-gate[data-effect="arkaon-neon-trace"] .apf-title{color:#f4eeff}.apf-gate[data-effect="arkaon-orbit-halo"]:after{opacity:.3}}

.apf-custom-title{animation:none!important;background:none!important;color:#eee3d4!important;filter:none!important;font-size:clamp(1.5rem,6vw,6rem)}
.apf-text-group{display:inline-flex;flex-wrap:wrap;gap:.25em;justify-content:center;align-items:baseline;max-width:100%}
.apf-text-segment{display:inline-block;overflow-wrap:anywhere;max-width:100%;font-family:var(--apf-font);font-weight:var(--apf-weight,800);color:var(--apf-color,#eee3d4);animation:var(--apf-enter-name,apf-text-still) var(--apf-in-duration) ease var(--apf-delay) both}
.apf-text-exit{display:inline-block;max-width:100%;animation:var(--apf-exit-name,apf-text-still) var(--apf-out-duration) ease var(--apf-exit-delay) forwards}
.apf-text-glow{display:inline-block;max-width:100%}
.apf-text-glow[data-glow="glow"]{text-shadow:0 0 8px var(--apf-glow-color),0 0 22px var(--apf-glow-color)}
.apf-text-glow[data-glow="pulse"]{animation:apf-text-pulse 2s ease-in-out var(--apf-delay) 3 alternate both}
.apf-text-glow[data-glow="shine"]{background:linear-gradient(110deg,var(--apf-color) 35%,#fff 48%,var(--apf-glow-color) 52%,var(--apf-color) 65%);background-size:250% 100%;background-clip:text;color:transparent;animation:apf-text-shine 2s ease var(--apf-delay) 3 both}
@keyframes apf-text-still{from{transform:none}to{transform:none}}
@keyframes apf-text-fade-in{from{opacity:0}to{opacity:1}}
@keyframes apf-text-rise{from{opacity:0;transform:translateY(.7em)}to{opacity:1;transform:none}}
@keyframes apf-text-zoom-in{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes apf-text-flip-in{from{opacity:0;transform:perspective(600px) rotateY(-90deg)}to{opacity:1;transform:none}}
@keyframes apf-text-fade-out{to{opacity:0}}
@keyframes apf-text-sink{to{opacity:0;transform:translateY(.7em)}}
@keyframes apf-text-zoom-out{to{opacity:0;transform:scale(.3)}}
@keyframes apf-text-pulse{from{text-shadow:0 0 4px var(--apf-glow-color)}to{text-shadow:0 0 14px var(--apf-glow-color),0 0 28px var(--apf-glow-color)}}
@keyframes apf-text-shine{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.apf-text-segment,.apf-text-exit,.apf-text-glow{animation:none!important;opacity:1!important;transform:none!important}.apf-text-glow[data-glow="shine"]{background:none;color:var(--apf-color)}}
.apf-title,.apf-subtitle{font-family:"Malgun Gothic", "Apple SD Gothic Neo", sans-serif}</style>
<section class="apf-gate" data-effect="arkaon-cinematic-gate" aria-label="플랫폼 진입">
<div class="apf-beam" aria-hidden="true"></div><button class="apf-skip" type="button">건너뛰기</button>
<div class="apf-content"><h1 class="apf-title"><span class="apf-layered" aria-label="더 아리랑 스토어"><span class="apf-word apf-word-left" aria-hidden="true"><span class="apf-text-group" aria-label="더"><span class="apf-text-segment" style="--apf-font:&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, sans-serif;--apf-weight:800;--apf-color:#eee3d4;--apf-glow-color:#ad79ff;--apf-enter-name:apf-text-fade-in;--apf-exit-name:apf-text-still;--apf-delay:0.0s;--apf-in-duration:1.0s;--apf-out-duration:1.0s;--apf-exit-delay:3.0s" aria-hidden="true"><span class="apf-text-exit"><span class="apf-text-glow" data-glow="glow">더</span></span></span></span></span><span class="apf-word apf-word-center" aria-hidden="true"><span class="apf-text-group" aria-label="아리랑"><span class="apf-text-segment" style="--apf-font:Batang, &quot;AppleMyungjo&quot;, serif;--apf-weight:800;--apf-color:#ffe4a1;--apf-glow-color:#ad79ff;--apf-enter-name:apf-text-zoom-in;--apf-exit-name:apf-text-still;--apf-delay:2.8s;--apf-in-duration:1.0s;--apf-out-duration:1.0s;--apf-exit-delay:5.8s" aria-hidden="true"><span class="apf-text-exit"><span class="apf-text-glow" data-glow="shine">아리랑</span></span></span></span></span><span class="apf-word apf-word-right" aria-hidden="true"><span class="apf-text-group" aria-label="스토어"><span class="apf-text-segment" style="--apf-font:&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, sans-serif;--apf-weight:800;--apf-color:#eee3d4;--apf-glow-color:#ad79ff;--apf-enter-name:apf-text-rise;--apf-exit-name:apf-text-still;--apf-delay:1.6s;--apf-in-duration:1.0s;--apf-out-duration:1.0s;--apf-exit-delay:4.6s" aria-hidden="true"><span class="apf-text-exit"><span class="apf-text-glow" data-glow="pulse">스토어</span></span></span></span></span></span></h1><p class="apf-subtitle">THE ARIRANG STORE</p><button class="apf-enter" type="button">플랫폼 시작하기</button></div>
</section>
<main class="apf-platform" hidden tabindex="-1"><h2>플랫폼에 오신 것을 환영합니다</h2><p>이 영역을 실제 플랫폼 화면으로 교체하세요.</p><button type="button" data-replay>진입 효과 다시 보기</button></main>
<script>
(()=>{const gate=document.querySelector('.apf-gate'),platform=document.querySelector('.apf-platform');let leaving=false,timer;
function alignWords(){const group=gate.querySelector('.apf-layered');if(!group)return;group.classList.remove('apf-ready');const words=[...group.children];words.forEach(w=>w.style.animationName='none');const center=group.getBoundingClientRect();words.forEach(w=>{const box=w.getBoundingClientRect();w.style.setProperty('--apf-offset',`${center.left+center.width/2-box.left-box.width/2}px`);});words.forEach(w=>w.style.animationName='');void group.offsetWidth;group.classList.add('apf-ready');}
alignWords();if(document.fonts)document.fonts.ready.then(alignWords);
function finish(){clearTimeout(timer);gate.hidden=true;gate.classList.remove('apf-leaving');platform.hidden=false;platform.focus();gate.dispatchEvent(new CustomEvent('arkaon:entered',{bubbles:true,detail:{effect:gate.dataset.effect}}));}
function enter(){if(leaving)return;leaving=true;if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}gate.classList.add('apf-leaving');timer=setTimeout(finish,750);}
gate.addEventListener('animationend',e=>{if(e.target===gate&&e.animationName==='apf-exit')finish();});gate.querySelectorAll('button').forEach(b=>b.addEventListener('click',enter));
document.querySelector('[data-replay]').addEventListener('click',()=>{clearTimeout(timer);leaving=false;platform.hidden=true;gate.hidden=false;gate.classList.remove('apf-leaving');alignWords();gate.querySelector('.apf-enter').focus();});
})();
</script></html>
