<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 진입 효과 스튜디오</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#edf3ff;font-family:system-ui,sans-serif}header{padding:24px;max-width:1400px;margin:auto}h1{font-size:clamp(22px,4vw,36px)}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end}label{display:grid;gap:8px;font-size:14px}input,select,button{font:inherit;border-radius:7px;padding:10px;background:#18263e;color:#edf3ff;border:1px solid #607595}input[type=color]{width:60px;height:44px;padding:4px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c9a8ff;outline-offset:3px}iframe{width:100%;height:75svh;min-height:480px;border:0;display:block}p{color:#b8c8de;line-height:1.6}.hint{font-size:13px}</style>
<header><h1>ARKAON 진입 효과 스튜디오 · 9종</h1><p>효과를 선택하고 문구·색상·속도를 바꿔 재생하세요. 다운로드한 HTML은 독립 실행됩니다.</p><div class="controls">
<label>효과<select id="effect"></select></label><label>타이틀<input id="title" value="더 아리랑 스토어" maxlength="160"></label><label>보조문구<input id="subtitle" value="THE ARIRANG STORE" maxlength="160"></label><label>강조색<input id="accent" type="color" value="#ad79ff"></label><label>배경색<input id="background" type="color" value="#071522"></label><label>총 동작 시간<select id="duration"><option value="2">2초</option><option value="4" selected>4초</option><option value="6">6초</option></select></label><button id="play">다시 재생</button><button id="download">HTML 다운로드</button></div><p id="description" aria-live="polite"></p><p class="hint">기존 세 문구 적층 예제는 arirang-cinematic-gate.html에서 확인하세요. 시작 버튼 이후 플랫폼 영역은 서비스 연결용 예시입니다.</p></header>
<iframe id="preview" title="선택한 진입 효과 미리보기" sandbox="allow-scripts"></iframe>
<script>
const effects=[{"id": "arkaon-cinematic-gate", "name": "아르카온 시네마틱 게이트", "description": "중앙 펼침 / 세 문구 순차 이동·돌출", "pattern_token": "entry-effect:arkaon-cinematic-gate"}, {"id": "arkaon-iris-reveal", "name": "아르카온 아이리스 오픈", "description": "중앙 원형 마스크가 넓어지는 진입", "pattern_token": "entry-effect:arkaon-iris-reveal"}, {"id": "arkaon-curtain-open", "name": "아르카온 커튼 오픈", "description": "좌우 커튼이 열리는 무대형 진입", "pattern_token": "entry-effect:arkaon-curtain-open"}, {"id": "arkaon-stagger-rise", "name": "아르카온 순차 타이포", "description": "글자가 차례로 올라와 정렬", "pattern_token": "entry-effect:arkaon-stagger-rise"}, {"id": "arkaon-focus-reveal", "name": "아르카온 포커스 리빌", "description": "흐릿한 글자가 선명하게 자리잡음", "pattern_token": "entry-effect:arkaon-focus-reveal"}, {"id": "arkaon-neon-trace", "name": "아르카온 네온 트레이스", "description": "윤곽에서 발광 타이틀로 전환", "pattern_token": "entry-effect:arkaon-neon-trace"}, {"id": "arkaon-perspective-flip", "name": "아르카온 입체 플립", "description": "원근 회전으로 타이틀 등장", "pattern_token": "entry-effect:arkaon-perspective-flip"}, {"id": "arkaon-orbit-halo", "name": "아르카온 오비트 헤일로", "description": "빛의 궤도가 타이틀 주위에 정착", "pattern_token": "entry-effect:arkaon-orbit-halo"}, {"id": "arkaon-scan-reveal", "name": "아르카온 스캔 리빌", "description": "빛이 위에서 아래로 문구를 스캔", "pattern_token": "entry-effect:arkaon-scan-reveal"}], template="\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>아르카온 시네마틱 게이트\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#071522;color:#eef3ff;font-family:system-ui,sans-serif}.apf-gate{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at center,#263b58 0%,#10263c 40%,#050c17 100%)}\n.apf-gate:before{content:\"\";position:absolute;inset:-30%;z-index:-1;background:radial-gradient(ellipse at 45% 50%,#7676cc35,transparent 45%),repeating-linear-gradient(117deg,transparent 0 120px,#8abbff05 121px 123px);animation:apf-atmosphere 12s ease-in-out infinite alternate}\n.apf-beam{position:absolute;top:50%;left:-20%;width:140%;height:2px;background:linear-gradient(90deg,transparent,#7887f2,#f5caff,#7887f2,transparent);box-shadow:0 0 16px 5px #ad79ff65;transform:rotate(-3deg);animation:apf-beam 3.8s ease both;pointer-events:none}.apf-beam:after{content:\"\";position:absolute;inset:-70px 25%;background:radial-gradient(ellipse,#d7a0ff42,transparent 65%)}\n.apf-content{text-align:center;z-index:1;padding:24px;width:100%;}.apf-title{margin:0;font-size:clamp(2.6rem,9vw,7rem);line-height:1.15;font-weight:900;letter-spacing:.06em;overflow-wrap:anywhere;background:linear-gradient(#fff4d6 5%,#c9aecb 45%,#fff0d4 52%,#977eaa 95%);background-clip:text;color:transparent;animation:apf-title-unfold 2.3s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 2px 0 #484759) drop-shadow(0 0 18px #d797ff60)}.apf-subtitle{color:#b9cae1;letter-spacing:.17em;font-size:clamp(.85rem,2vw,1.1rem);margin:24px 0 40px}.apf-enter,.apf-skip{cursor:pointer;font:inherit;color:#edf3ff;border:1px solid #a5b4e780;border-radius:8px;background:#152942cc;padding:14px 30px}.apf-enter:hover,.apf-enter:focus-visible{background:#35466b;outline:2px solid #d4b9ff;outline-offset:4px}.apf-skip{position:absolute;right:20px;top:20px;padding:8px 14px}.apf-gate.apf-leaving{animation:apf-exit .65s ease-in forwards;pointer-events:none}.apf-platform{min-height:100svh;padding:clamp(24px,6vw,80px)}[hidden]{display:none!important}\n@keyframes apf-title-unfold{0%{opacity:0;clip-path:inset(0 50%);transform:scaleX(.55);letter-spacing:-.08em}15%{opacity:1;clip-path:inset(0 43%)}75%{clip-path:inset(0 0);transform:scaleX(1.025);letter-spacing:.07em}100%{opacity:1;clip-path:inset(0 0);transform:scaleX(1);letter-spacing:.06em}}@keyframes apf-beam{0%{opacity:0;transform:translateX(-25%) rotate(-3deg) scaleX(.3)}35%,70%{opacity:1}100%{opacity:.6;transform:translateX(0) rotate(-3deg) scaleX(1)}}@keyframes apf-atmosphere{to{transform:translate(3%,2%) rotate(3deg)}}@keyframes apf-exit{to{opacity:0;transform:scale(1.08);filter:blur(8px)}}\n@media(prefers-reduced-motion:reduce){.apf-gate,.apf-gate:before,.apf-content,.apf-title,.apf-beam,.apf-gate.apf-leaving{animation:none!important}.apf-content{opacity:1;filter:none}}\n\n.apf-title:has(.apf-layered){animation:none;filter:none;background:none;font-size:clamp(1.7rem,6.8vw,6rem);color:#eee3d4}\n.apf-layered{display:inline-flex;gap:.26em;perspective:800px;transform-style:preserve-3d;max-width:100%}\n.apf-word{display:inline-block;white-space:nowrap;transform-style:preserve-3d;color:#e6d3df;text-shadow:0 2px 0 #716078,0 0 18px #b283dd77;animation-duration:1.2s;animation-timing-function:cubic-bezier(.22,1,.36,1);animation-fill-mode:both;animation-play-state:paused}\n.apf-ready .apf-word{animation-play-state:running}\n.apf-word-left{position:relative;z-index:3;animation-name:apf-word-left;animation-delay:.4s}\n.apf-word-right{position:relative;z-index:2;animation-name:apf-word-right;animation-delay:1.6s}\n.apf-word-center{position:relative;z-index:1;animation-name:apf-word-center;animation-delay:2.8s}\n@keyframes apf-word-left{from{transform:translateX(var(--apf-offset,0px)) translateZ(80px)}to{transform:translateX(0) translateZ(0)}}\n@keyframes apf-word-right{from{transform:translateX(var(--apf-offset,0px)) translateZ(40px)}to{transform:translateX(0) translateZ(0)}}\n@keyframes apf-word-center{from{transform:translateX(var(--apf-offset,0px)) translateZ(-40px);color:#847899;text-shadow:0 1px 0 #39354f}to{transform:translateX(0) translateZ(35px);color:#ffe4a1;text-shadow:0 1px 0 #a57739,0 2px 0 #94642e,0 3px 0 #805125,0 4px 0 #684022,0 5px 0 #51311c,0 9px 15px #0009,0 0 25px #ffcc7566}}\n@media(prefers-reduced-motion:reduce){.apf-word{animation:none!important;transform:none!important}.apf-word-center{color:#ffe4a1;text-shadow:0 2px 0 #94642e,0 4px 0 #684022}}\n:root{--apf-accent:#ad79ff;--apf-background:#071522;--apf-duration:4.0s}\n.apf-gate{background:radial-gradient(ellipse at center,#263b58,var(--apf-background) 75%)}\n.apf-beam{background:linear-gradient(90deg,transparent,var(--apf-accent),#fff,var(--apf-accent),transparent);box-shadow:0 0 18px var(--apf-accent)}\n.apf-title{animation-duration:var(--apf-duration)}\n.apf-word{animation-duration:calc(var(--apf-duration)*.3)}\n.apf-word-left{animation-delay:calc(var(--apf-duration)*.1)}\n.apf-word-right{animation-delay:calc(var(--apf-duration)*.4)}\n.apf-word-center{animation-delay:calc(var(--apf-duration)*.7)}\n.apf-gate[data-effect=\"arkaon-iris-reveal\"] .apf-content{animation:apf-iris var(--apf-duration) ease both}\n.apf-gate[data-effect=\"arkaon-iris-reveal\"] .apf-title{animation:none}\n@keyframes apf-iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(100% at 50% 50%)}}\n.apf-gate[data-effect=\"arkaon-curtain-open\"]:after{content:\"\";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--apf-background),#314061,var(--apf-background));animation:apf-curtains var(--apf-duration) ease-in-out both}\n.apf-gate[data-effect=\"arkaon-curtain-open\"] .apf-title{animation-name:apf-curtain-title}\n.apf-skip{z-index:5}\n@keyframes apf-curtains{0%,12%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,50% 0,50% 100%,50% 100%,50% 0)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,0 0,0 100%,100% 100%,100% 0)}}\n@keyframes apf-curtain-title{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}\n.apf-gate[data-effect=\"arkaon-stagger-rise\"] .apf-title{animation:none;background:none;color:#eee3d4;filter:none}\n.apf-char{display:inline-block;white-space:pre;animation:apf-stagger calc(var(--apf-duration)*.4) cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--apf-duration)*.6*var(--apf-progress))}\n@keyframes apf-stagger{from{opacity:0;transform:translateY(1em) rotateX(-65deg)}to{opacity:1;transform:none}}\n.apf-gate[data-effect=\"arkaon-focus-reveal\"] .apf-title{animation-name:apf-focus}\n@keyframes apf-focus{from{opacity:0;filter:blur(18px);transform:scale(1.12)}to{opacity:1;filter:blur(0);transform:scale(1)}}\n.apf-gate[data-effect=\"arkaon-neon-trace\"] .apf-title{background:none;animation-name:apf-neon;-webkit-text-stroke:1px var(--apf-accent)}\n@keyframes apf-neon{0%{color:transparent;opacity:0;text-shadow:none}40%{color:transparent;opacity:1;text-shadow:0 0 5px var(--apf-accent)}100%{color:#f4eeff;opacity:1;text-shadow:0 0 12px var(--apf-accent),0 0 28px var(--apf-accent)}}\n.apf-gate[data-effect=\"arkaon-perspective-flip\"] .apf-title{animation-name:apf-flip}\n@keyframes apf-flip{from{opacity:0;transform:perspective(900px) rotateY(-80deg) translateZ(-100px)}to{opacity:1;transform:perspective(900px) rotateY(0) translateZ(0)}}\n.apf-gate[data-effect=\"arkaon-orbit-halo\"]:after{content:\"\";position:absolute;width:min(70vw,600px);aspect-ratio:1;border:2px solid var(--apf-accent);border-radius:50%;box-shadow:0 0 30px var(--apf-accent);pointer-events:none;animation:apf-orbit var(--apf-duration) ease-out both}\n.apf-gate[data-effect=\"arkaon-orbit-halo\"] .apf-title{animation-name:apf-orbit-title}\n@keyframes apf-orbit{from{opacity:0;transform:perspective(800px) rotateX(75deg) rotateY(70deg) scale(.4)}to{opacity:.3;transform:perspective(800px) rotateX(55deg) rotateY(-15deg) scale(1)}}\n@keyframes apf-orbit-title{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}\n.apf-gate[data-effect=\"arkaon-scan-reveal\"] .apf-title{animation-name:apf-scan}\n.apf-gate[data-effect=\"arkaon-scan-reveal\"] .apf-beam{animation:apf-scan-beam var(--apf-duration) linear both;transform:none}\n@keyframes apf-scan{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}\n@keyframes apf-scan-beam{0%{top:25%;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:75%;opacity:0}}\n@media(prefers-reduced-motion:reduce){.apf-content,.apf-title,.apf-char,.apf-word,.apf-gate:after{animation:none!important;opacity:1;clip-path:none;transform:none;filter:none}.apf-gate[data-effect=\"arkaon-curtain-open\"]:after{display:none}.apf-gate[data-effect=\"arkaon-neon-trace\"] .apf-title{color:#f4eeff}.apf-gate[data-effect=\"arkaon-orbit-halo\"]:after{opacity:.3}}\n\u003c/style>\n\u003csection class=\"apf-gate\" data-effect=\"arkaon-cinematic-gate\" aria-label=\"플랫폼 진입\">\n\u003cdiv class=\"apf-beam\" aria-hidden=\"true\">\u003c/div>\u003cbutton class=\"apf-skip\" type=\"button\">건너뛰기\u003c/button>\n\u003cdiv class=\"apf-content\">\u003ch1 class=\"apf-title\">더 아리랑 스토어\u003c/h1>\u003cp class=\"apf-subtitle\">THE ARIRANG STORE\u003c/p>\u003cbutton class=\"apf-enter\" type=\"button\">플랫폼 시작하기\u003c/button>\u003c/div>\n\u003c/section>\n\u003cmain class=\"apf-platform\" hidden tabindex=\"-1\">\u003ch2>플랫폼에 오신 것을 환영합니다\u003c/h2>\u003cp>이 영역을 실제 플랫폼 화면으로 교체하세요.\u003c/p>\u003cbutton type=\"button\" data-replay>진입 효과 다시 보기\u003c/button>\u003c/main>\n\u003cscript>\n(()=>{const gate=document.querySelector('.apf-gate'),platform=document.querySelector('.apf-platform');let leaving=false,timer;\nfunction alignWords(){const group=gate.querySelector('.apf-layered');if(!group)return;group.classList.remove('apf-ready');const words=[...group.children];words.forEach(w=>w.style.animationName='none');const center=group.getBoundingClientRect();words.forEach(w=>{const box=w.getBoundingClientRect();w.style.setProperty('--apf-offset',`${center.left+center.width/2-box.left-box.width/2}px`);});words.forEach(w=>w.style.animationName='');void group.offsetWidth;group.classList.add('apf-ready');}\nalignWords();if(document.fonts)document.fonts.ready.then(alignWords);\nfunction finish(){clearTimeout(timer);gate.hidden=true;gate.classList.remove('apf-leaving');platform.hidden=false;platform.focus();gate.dispatchEvent(new CustomEvent('arkaon:entered',{bubbles:true,detail:{effect:gate.dataset.effect}}));}\nfunction enter(){if(leaving)return;leaving=true;if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}gate.classList.add('apf-leaving');timer=setTimeout(finish,750);}\ngate.addEventListener('animationend',e=>{if(e.target===gate&&e.animationName==='apf-exit')finish();});gate.querySelectorAll('button').forEach(b=>b.addEventListener('click',enter));\ndocument.querySelector('[data-replay]').addEventListener('click',()=>{clearTimeout(timer);leaving=false;platform.hidden=true;gate.hidden=false;gate.classList.remove('apf-leaving');alignWords();gate.querySelector('.apf-enter').focus();});\n})();\n\u003c/script>\u003c/html>\n", get=id=>document.getElementById(id);let output='';
effects.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;get('effect').append(o);});
function render(){const e=effects.find(e=>e.id===get('effect').value);const doc=new DOMParser().parseFromString(template,'text/html');doc.querySelector('.apf-gate').dataset.effect=e.id;const title=get('title').value.trim()||'ARKAON',subtitle=get('subtitle').value.trim()||'당신의 아이디어가 현실이 되는 순간';const h=doc.querySelector('.apf-title');h.textContent='';if(e.id==='arkaon-stagger-rise'){const wrapper=doc.createElement('span');wrapper.setAttribute('aria-label',title);const chars=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('ko',{granularity:'grapheme'}).segment(title)].map(x=>x.segment):Array.from(title);chars.forEach((char,i)=>{const span=doc.createElement('span');span.className='apf-char';span.setAttribute('aria-hidden','true');span.style.setProperty('--apf-progress',String(i/Math.max(1,chars.length-1)));span.textContent=char;wrapper.append(span);});h.append(wrapper);}else{h.textContent=title;}doc.querySelector('.apf-subtitle').textContent=subtitle;doc.documentElement.style.setProperty('--apf-accent',get('accent').value);doc.documentElement.style.setProperty('--apf-background',get('background').value);doc.documentElement.style.setProperty('--apf-duration',get('duration').value+'s');output='<!doctype html>'+doc.documentElement.outerHTML;get('preview').srcdoc=output;get('description').textContent=e.description+' · 호출 이름: '+e.id;}
get('play').addEventListener('click',render);['effect','accent','background','duration'].forEach(id=>get(id).addEventListener('change',render));get('download').addEventListener('click',()=>{render();const url=URL.createObjectURL(new Blob([output],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=get('effect').value+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});render();
</script></html>
