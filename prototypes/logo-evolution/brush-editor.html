<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 마스크 브러시 및 타임라인</title><style>body{background:#0b1424;color:#eff7ff;font:15px/1.5 system-ui;max-width:1100px;margin:20px auto;padding:12px}canvas{width:100%;background:#17263b;border:1px solid #5b7797;border-radius:12px;touch-action:none}label{display:block;margin:10px 0 4px}input,select,button{font:inherit}button,select{background:#25415f;color:white;border:1px solid #7292b3;padding:7px;border-radius:7px}button{cursor:pointer}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:minmax(0,2fr) 290px;gap:20px}#regions button{display:block;width:100%;text-align:left;margin:4px 0}.active{outline:2px solid #ffdb82}input[type=range]{width:100%}p{color:#b8cee4}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head><body><h1>ARKAON 로고 진화 · 브러시 & 타임라인</h1><p>투명 PNG 로고를 권장합니다. 선택한 영역의 픽셀을 브러시로 추가·삭제하고 효과별 시작·지속 시간을 지정합니다. 브라우저 내에서만 처리합니다.</p><div class="layout"><main><label for="file">로고 업로드</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><canvas id="stage" width="960" height="600" aria-label="로고 편집 캔버스"></canvas><p id="status" role="status">로고 이미지를 선택하세요.</p><label for="time">재생 위치 <output id="timeLabel">0.0초</output></label><input id="time" type="range" min="0" max="10" step=".05" value="0"><button id="play">재생</button><button id="reset">처음으로</button></main><aside><label for="level">효과 레벨 <output id="levelLabel">3</output></label><input id="level" type="range" min="1" max="5" value="3"><div id="regions"></div><label for="name">영역 이름</label><input id="name"><label for="mode">브러시</label><select id="mode"><option value="inspect">영역 선택</option><option value="add">픽셀 추가</option><option value="erase">픽셀 삭제</option></select><label for="radius">브러시 크기 <output id="radiusLabel">8</output>px</label><input id="radius" type="range" min="1" max="50" value="8"><button id="undo">브러시 실행 취소</button><label for="effect">효과</label><select id="effect"><option value="none">없음</option><option value="glow">발광 (L2)</option><option value="sweep">반사광 (L3)</option><option value="pop">확대 (L4)</option></select><label for="start">시작 시각 (초)</label><input id="start" type="number" min="0" max="10" step=".1" value="0"><label for="duration">지속 시간 (초)</label><input id="duration" type="number" min=".1" max="10" step=".1" value="2"><label><input id="loop" type="checkbox"> 반복</label><button id="save">설정 JSON 저장</button></aside></div><script type="module" src="./brush-editor.js"></script></body></html>
