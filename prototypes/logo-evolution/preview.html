<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 로고 로컬 미리보기</title><style>body{font:16px system-ui;background:#08101e;color:#f0f5ff;max-width:760px;margin:25px auto;padding:15px}canvas{width:100%;border:1px solid #455b77;border-radius:12px}label{display:block;margin:16px 0 5px}input[type=range]{width:100%}select,button,input{font:inherit}select,button{padding:8px;background:#1b3657;color:white;border:1px solid #6c89a9;border-radius:7px}p{color:#bdcbe0}</style></head><body><h1>ARKAON 로고 진화 — 로컬 미리보기</h1><p>사용자가 보유한 로고 이미지를 선택하세요. 파일은 서버로 전송되지 않습니다. 원본은 유지됩니다.</p><label for="imageInput">로고 이미지 (PNG/JPEG/WebP, 8MB 이하)</label><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp"><label for="previewLevel">구현 레벨</label><input id="previewLevel" type="range" min="1" max="5" value="1"><label for="previewType">로고 유형</label><select id="previewType"><option value="symbol">심볼</option><option value="text">텍스트</option><option value="geometric">기하학</option><option value="metallic">금속</option><option value="character">캐릭터</option></select><label for="previewIntensity">표현 강도</label><select id="previewIntensity"><option value="natural">자연</option><option value="balanced" selected>균형</option><option value="vivid">강렬</option></select><p><button id="play" type="button">일시정지</button></p><canvas id="stage" width="960" height="540" aria-label="로고 애니메이션 미리보기"></canvas><p id="previewNotice" role="status">실시간 Canvas 미리보기입니다. 구성 요소 분석·정밀 마스킹·영상 출력은 아직 연결되지 않았습니다.</p><script type="module" src="./local-preview.js"></script></body></html>
