<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 로고 영역 수동 분리 및 영상 출력</title><style>body{font:15px/1.5 system-ui;background:#0a1424;color:#eff7ff;max-width:1050px;margin:20px auto;padding:14px}canvas{width:100%;background:#17243b;border:1px solid #50647f;border-radius:10px;touch-action:none}label{display:block;margin:12px 0 5px}button,select,input{font:inherit}button,select{padding:8px;border-radius:7px;background:#223b59;color:#fff;border:1px solid #6484a5}button{cursor:pointer}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #9cddff}input[type=range]{width:100%}.layout{display:grid;grid-template-columns:minmax(0,2fr) 270px;gap:20px}.hint{color:#b5c9df}#list{max-height:280px;overflow:auto}.entry{display:block;width:100%;text-align:left;margin:4px 0}.active{border-color:#ffcd73;background:#355473}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><h1>ARKAON 로고 진화 · 수동 분리와 영상 출력</h1><p class="hint">투명 PNG 권장. 영역을 선택한 후 드래그해 분리할 사각 영역을 지정하세요. 결과는 브라우저에서 WebM으로 녹화합니다. MP4는 별도 렌더러가 필요합니다.</p><div class="layout"><section><label for="file">로고 이미지</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><canvas id="stage" width="960" height="600" tabindex="0" aria-label="로고 미리보기와 수동 분리 영역 드래그"></canvas><p id="status" role="status">이미지를 선택하세요.</p><button id="record" disabled>5초 WebM 녹화</button><a id="download" hidden>영상 저장</a></section><aside><label for="level">구현 레벨 <output id="levelValue">3</output></label><input id="level" type="range" min="1" max="5" value="3"><label for="effect">선택 영역 효과</label><select id="effect"><option value="glow">발광 (L2)</option><option value="sweep">반사광 (L3)</option><option value="pop">확대 (L4)</option><option value="none">없음</option></select><label for="name">영역 이름</label><input id="name" placeholder="예: 글자 A"><p class="hint">검출된 영역</p><div id="list"></div><button id="split" disabled>선택 영역을 드래그한 사각형으로 분리</button><button id="undo" disabled>마지막 분리 취소</button><p class="hint">수동 분리는 선택 영역의 픽셀 마스크와 지정한 사각형의 교집합을 새 영역으로 옮깁니다. 원본 픽셀은 삭제되지 않습니다.</p></aside></div><script type="module" src="./manual-export.js"></script></body></html>
