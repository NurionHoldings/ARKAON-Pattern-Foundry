<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 영역별 로고 진화</title><style>
:root{color-scheme:dark}body{font:15px/1.5 system-ui;background:#091323;color:#e9f3ff;max-width:1100px;margin:20px auto;padding:15px}h1{font-size:24px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:20px}canvas{width:100%;background:#142039;border-radius:12px;touch-action:manipulation}fieldset{border:1px solid #445c78;border-radius:12px;margin:10px 0;padding:12px}label{display:block;margin:8px 0}button,select,input{font:inherit}button,select{background:#213957;color:#fff;border:1px solid #5d7e9d;padding:7px;border-radius:7px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #91d9ff}input[type=range]{width:100%}p{color:#b9c9de}.region{display:flex;gap:6px;align-items:center;margin:7px 0}.region button{flex:1;text-align:left}.active{background:#275b7b!important;border-color:#8bdaff!important}.small{font-size:12px}.scroll{max-height:240px;overflow:auto}@media(max-width:720px){.layout{grid-template-columns:1fr}}</style></head><body>
<h1>ARKAON 로고 진화 · 구성 요소별 편집</h1><p>로고 파일을 선택하면 연결된 영역을 추출합니다. 영역을 선택해 이름과 효과를 지정할 수 있습니다. 원본 파일은 변경하거나 업로드하지 않습니다.</p>
<div class="layout"><section><label for="file">로고 파일 (PNG 권장)</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><canvas id="canvas" width="960" height="600" tabindex="0" aria-label="로고 미리보기. 검출 영역은 오른쪽 목록에서 선택할 수 있습니다."></canvas><p id="status" role="status">로고 파일을 선택하세요.</p><button id="play">일시정지</button> <button id="download">설정 JSON 저장</button></section>
<section><fieldset><legend>전체 구현 수준</legend><label for="level">레벨 <output id="levelLabel">3</output> / 5</label><input id="level" type="range" min="1" max="5" value="3"><label for="intensity">표현 강도</label><select id="intensity"><option value="natural">자연스럽게</option><option value="balanced" selected>균형</option><option value="vivid">강렬하게</option></select></fieldset>
<fieldset><legend>분석 영역</legend><div id="regions" class="scroll"><p>이미지를 불러오면 영역이 표시됩니다.</p></div></fieldset>
<fieldset><legend>선택한 영역 편집</legend><label for="name">영역 이름</label><input id="name" placeholder="예: 브랜드 심볼"><label for="effect">효과</label><select id="effect"><option value="none">효과 없음</option><option value="glow">네온 발광 (L2)</option><option value="color">색상 전이 (L2)</option><option value="sweep">반사광 (L3)</option><option value="pop">전후 확대 (L4)</option><option value="pulse">에너지 파동 (L5)</option></select><label><input type="checkbox" id="enabled" checked> 이 영역 효과 활성화</label><p class="small">레벨 미만 효과는 미리보기에 나타나지 않습니다. 사각형 단위의 실험적 마스킹이며 정밀 의미 분석은 아닙니다.</p></fieldset></section></div>
<script type="module" src="./region-editor.js"></script></body></html>
