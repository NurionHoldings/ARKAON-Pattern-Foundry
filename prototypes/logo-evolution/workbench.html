<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON Visual_DNA 통합 워크벤치</title><style>body{font:15px/1.5 system-ui;max-width:1100px;margin:24px auto;padding:16px;background:#0a1424;color:#eef7ff}h1{font-size:25px}canvas{width:100%;background:#14243c;border:1px solid #58728f;border-radius:12px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 300px;gap:18px}label{display:block;margin:10px 0 5px}input,button,select{font:inherit}button,select{padding:9px;background:#264362;border:1px solid #7496b5;color:#fff;border-radius:7px}button{cursor:pointer}button:disabled{opacity:.5}input[type=range]{width:100%}p{color:#b7cbe2}a{color:#9bdfff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#101f33;padding:10px}@media(max-width:740px){.layout{grid-template-columns:1fr}}</style></head><body><h1>ARKAON Visual_DNA — 생성부터 영상 출력까지</h1><p>이 페이지는 실제 SVG 계층을 생성하는 데모 생성기를 사용합니다. 기존 이미지 AI 생성 서비스와는 아직 연결되지 않았습니다.</p><div class="layout"><section><label for="brand">브랜드명</label><input id="brand" maxlength="28" value="ARKAON"><label for="accent">심볼 색상</label><input id="accent" type="color" value="#56c8ff"><button id="generate">로고 + Visual_DNA 생성</button><canvas id="stage" width="960" height="600"></canvas><p id="status" role="status">로고를 생성하세요.</p><button id="export" disabled>5초 영상 출력</button> <a id="video" hidden>영상 다운로드</a><button id="svg" disabled>SVG 저장</button> <button id="manifest" disabled>Visual_DNA 저장</button></section><aside><label for="layer">수정 접속 지점</label><select id="layer"></select><label for="effect">효과</label><select id="effect"><option value="none">없음</option><option value="glow">발광</option><option value="pop">확대</option><option value="sweep">반사광</option></select><label for="level">진화 레벨 <output id="levelValue">4</output></label><input id="level" type="range" min="1" max="5" value="4"><label for="start">시작(초)</label><input id="start" type="number" min="0" max="5" step=".1" value="0"><label for="duration">지속(초)</label><input id="duration" type="number" min=".1" max="5" step=".1" value="2"><label><input id="loop" type="checkbox" checked> 반복</label><p>브랜드명은 CORE 보호 대상입니다. 심볼에만 효과를 지정할 수 있습니다.</p><pre id="summary"></pre></aside></div><script type="module" src="./workbench.js"></script></body></html>
