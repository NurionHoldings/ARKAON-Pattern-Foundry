<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 정밀 마스크 미리보기</title><style>body{font:15px system-ui;max-width:950px;margin:20px auto;padding:16px;background:#0a1425;color:#edf5ff}canvas{width:100%;border:1px solid #49607c;border-radius:10px;background:#13243b}label{display:block;margin:12px 0}input[type=range]{width:100%}button,select,input{font:inherit}button,select{padding:8px;background:#203d5b;color:white;border:1px solid #7695b0;border-radius:7px}p{color:#b8cce0}</style></head><body><h1>ARKAON 픽셀 정밀 마스크</h1><p>투명 배경 PNG를 권장합니다. 검출된 각 구성 요소의 실제 픽셀에만 효과를 합성합니다. 원본은 변경하지 않습니다.</p><label>로고 이미지 <input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>구현 레벨 <output id="levelLabel">3</output><input id="level" type="range" min="1" max="5" value="3"></label><label>효과 대상 <select id="region"></select></label><label>효과 <select id="effect"><option value="glow">발광 (L2)</option><option value="color">색상 전이 (L2)</option><option value="sweep">표면 반사광 (L3)</option><option value="pop">확대·복귀 (L4)</option></select></label><canvas id="canvas" width="960" height="600"></canvas><p id="status" role="status">이미지를 선택하세요.</p><script type="module" src="./precision-preview.js"></script></body></html>
