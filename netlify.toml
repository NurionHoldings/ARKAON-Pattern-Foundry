[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/foundry-proxy?proxy_path=%2Fhealth"
  status = 200
  force = true

[[redirects]]
  from = "/console"
  to = "/.netlify/functions/foundry-proxy?proxy_path=%2Fconsole"
  status = 200
  force = true

[[redirects]]
  from = "/console/*"
  to = "/.netlify/functions/foundry-proxy?proxy_path=%2Fconsole%2F:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/foundry-proxy?proxy_path=%2Fv1%2F:splat"
  status = 200
  force = true
