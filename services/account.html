<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>내 계정과 결제 · 아르카온</title>
  <link rel="stylesheet" href="/services/services.css">
</head>
<body>
  <div class="shell">
    <div class="svc-top"><h1>내 계정과 결제</h1><a class="svc-home" href="/">← 홈</a></div>
    <div class="panel">
      <h2>Foundry API 연결</h2>
      <p class="muted">기본값은 이 사이트와 동일 출처(/health, /console)입니다. Foundry를 다른 호스트에서 직접 쓸 때만 API 루트 URL을 입력하세요.</p>
      <label>API 기준 URL (선택)<input id="apiBase" type="url" placeholder="비우면 동일 출처" maxlength="256"></label>
      <div class="btn-row">
        <button type="button" id="saveApi">저장</button>
        <button type="button" id="testApi">연결 확인</button>
      </div>
      <p id="apiStatus" class="muted" role="status"></p>
    </div>
    <div class="panel">
      <h2>이 브라우저의 작업</h2>
      <ul class="list" id="projects"></ul>
      <p class="warn">결제·회원 청구는 샌드박스 검증 중입니다. 실제 과금은 별도 승인 후 제공됩니다.</p>
    </div>
  </div>
  <script src="/services/services.js"></script>
  <script>
    const {readProjects,getApiBase,setApiBase,probeApi,resolveApiBase,usesSameOriginApi}=APFHomeServices;
    document.getElementById('apiBase').value=getApiBase();
    document.getElementById('saveApi').addEventListener('click',()=>{
      setApiBase(document.getElementById('apiBase').value);
      document.getElementById('apiStatus').textContent='저장했습니다.';
    });
    document.getElementById('testApi').addEventListener('click',async()=>{
      const base=document.getElementById('apiBase').value.trim()||resolveApiBase();
      const result=await probeApi(base);
      const mode=usesSameOriginApi()?'동일 출처':'직접 URL';
      document.getElementById('apiStatus').textContent=result.ok
        ? `연결됨 (${mode}, /health 또는 /console 응답)`
        : (result.reason==='foundry_api_not_configured'
          ? 'Foundry 프록시가 아직 설정되지 않았습니다. Netlify APF_API_ORIGIN을 확인하세요.'
          : '연결되지 않았습니다. URL·프록시·서버 실행 상태를 확인하세요.');
      document.getElementById('apiStatus').className=result.ok?'ok':'warn';
    });
    const root=document.getElementById('projects');
    const items=readProjects();
    if(!items.length) root.innerHTML='<li class="muted">저장된 작업이 없습니다.</li>';
    else for(const item of items){
      const li=document.createElement('li');
      li.innerHTML=`<span>${item.title} <span class="chip">${item.type}</span></span><span class="muted">${item.updated_at?.slice(0,19)||''}</span>`;
      root.append(li);
    }
  </script>
</body>
</html>
