<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/services/services.css">
  <link rel="stylesheet" href="/assets/interactions.css">

  <script src="/assets/header-video.js" defer></script>

<body class="atelier-workspace" data-space="menu">
  <div class="shell">
    <div class="svc-top"><a class="mini-brand" href="/" aria-label="아르카온 홈"><span class="mini-brand-picture" aria-hidden="true"><span class="mini-brand-emblem">A</span><video class="mini-brand-video" data-header-video muted loop playsinline preload="none" tabindex="-1"></video></span><span class="mini-brand-copy"><strong>ARKAON</strong><small>CREATIVE ATELIER</small></span></a>
      <h1>아르카온 서비스</h1>
      <nav class="svc-return-nav" aria-label="페이지 이동"><a class="svc-home" href="/" data-service-back>← 이전</a><a class="svc-home" href="/">홈 ↗</a></nav>
    </div>
    <p class="muted">브랜드·영상·홈페이지·작업 요청을 브라우저에서 바로 시작할 수 있습니다.</p>
    <ul class="list" id="serviceList"></ul>
  </div>
  <script>
    fetch('/config/arkaon-home-services.json').then(r=>r.json()).then(data=>{
      const root=document.getElementById('serviceList');
      for(const s of data.services){
        const li=document.createElement('li');
        const a=document.createElement('a');a.href=s.href;a.textContent=s.title;
        const chip=document.createElement('span');chip.className='chip';chip.textContent=s.status==='restricted'?'관리자':'이용 가능';
        li.append(a,chip);
        root.append(li);
      }
    }).catch(()=>{document.getElementById('serviceList').innerHTML='<li class="warn">서비스 목록을 불러오지 못했습니다.</li>';});
  </script>
<footer class="company-footer">
  <div class="company-footer-inner">
    <a class="company-footer-brand" href="/" aria-label="아르카온 홈"><span class="mini-brand-picture footer-logo-picture" aria-hidden="true"><span class="mini-brand-emblem">A</span><video class="mini-brand-video" data-header-video muted loop playsinline preload="none" tabindex="-1"></video></span><span>상상에 형태를. 가능성에 생명력을.</span></a>

    <nav class="company-footer-nav" aria-label="하단 메뉴"><a href="/services/">서비스 메뉴</a><a href="/services/mailbox.html">제안 우편함</a><a href="/services/admin.html">관리자</a></nav>
    <p class="company-copyright">© (주)아르카온</p>
  </div>
</footer>
</body>
</html>
