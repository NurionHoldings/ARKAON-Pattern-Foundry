<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>홈페이지 만들기 · 아르카온</title>
  <link rel="stylesheet" href="/services/services.css">
  <link rel="stylesheet" href="/assets/interactions.css">
  <link rel="stylesheet" href="/assets/atelier.css">
  <script src="/assets/interactions.js" defer></script>
  <link rel="stylesheet" href="/assets/appearance.css">
  <script src="/assets/appearance.js" defer></script>
  <script src="/assets/header-video.js" defer></script>
</head>
<body class="atelier-workspace" data-space="web">
  <div class="shell atelier-studio">
    <div class="svc-top"><a class="mini-brand" href="/" aria-label="아르카온 홈"><span class="mini-brand-picture" aria-hidden="true"><span class="mini-brand-emblem">A</span><video class="mini-brand-video" data-header-video muted loop playsinline preload="none" tabindex="-1"></video></span><span class="mini-brand-copy"><strong>ARKAON</strong><small>CREATIVE ATELIER</small></span></a><h1>홈페이지 만들기</h1><nav class="svc-return-nav" aria-label="페이지 이동"><a class="svc-home" href="/services/" data-service-back>← 이전</a><a class="svc-home" href="/services/">메뉴홈 ↗</a></nav></div>
    <form class="panel" id="form">
      <h2>나만의 홈페이지</h2>
      <p class="muted">검토한 스타일과 배치 규칙으로 제작하는 선택형 도구입니다. 설정을 바꾸면 미리보기와 내보낼 HTML에 반영됩니다.</p>
      <label>디자인 스타일<select id="style"><option value="atelier">아틀리에 · 아이보리와 청록</option><option value="midnight">미드나이트 · 깊은 남색</option><option value="editorial">에디토리얼 · 따뜻한 종이와 명조</option></select></label>
      <label>첫 화면 배치<select id="layout"><option value="split">소개와 장식 나란히</option><option value="stack">넓게 펼친 세로 구성</option></select></label>
      <label>등장 효과<select id="motion"><option value="luxury">럭셔리 · 부드러운 페이드와 이동</option><option value="subtle">간결한 등장</option><option value="none">움직임 없음</option></select></label>
      <div class="btn-row"><button type="button" id="loadDesign">최근 저장한 홈페이지 설정 불러오기</button></div>
      <p id="designStatus" role="status" class="muted">스타일을 선택하고 아래 내용을 채워 주세요.</p>
      <label>사이트 이름<input id="title" required maxlength="80" value="우리 가게"></label>
      <label>부제<input id="tagline" maxlength="160" value="정성과 AI가 만나는 공간"></label>
      <label>소개<textarea id="body" maxlength="2000">방문을 환영합니다. 서비스와 연락처를 이 페이지에 담았습니다.</textarea></label>
      <label>이메일<input id="email" type="email" maxlength="120"></label>
      <label>전화<input id="phone" maxlength="40"></label>
      <label>홈페이지 배경색<input id="background" type="color" value="#f4f1ea"></label>
      <label>버튼 배경색<input id="buttonColor" type="color" value="#194e4a"></label>
      <label>강조색<input id="accent" type="color" value="#194e4a"></label>
      <div class="btn-row">
        <button type="submit">HTML 저장 · 내 작업에 추가</button>
      </div>
    </form>
    <div class="panel preview"><iframe sandbox id="preview" title="홈페이지 미리보기"></iframe></div>
  </div>
  <script src="/services/services.js"></script>
  <script src="/services/customer-design.js"></script>
  <script src="/services/site-builder.js"></script>
<footer class="company-footer">

  </div>
</footer>

</html>
