<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>아르카온과 함께 작업하기 · 아르카온</title>
  <link rel="stylesheet" href="/services/services.css">
</head>
<body>
  <div class="shell">
    <div class="svc-top"><h1>아르카온과 함께 작업하기</h1><a class="svc-home" href="/">← 홈</a></div>
    <p class="muted">대화에서 정한 내용을 홈페이지 스튜디오로 이어갑니다. 같은 세션·초안에 저장되며, 다시 열어도 유지됩니다.</p>
    <form class="panel" id="form">
      <h2>작업 요청</h2>
      <label>제목<input id="title" required maxlength="120" placeholder="예: 온유 스튜디오 홈페이지"></label>
      <label>범위<select id="scope"><option value="LANDING">랜딩·홈페이지</option><option value="PLATFORM">플랫폼·서비스</option><option value="BRAND">브랜드·로고</option></select></label>
      <label>요청 내용<textarea id="message" required maxlength="4000" placeholder="이름, 고객, 목적, 차별점, 연락처를 적어 주세요. 참고 URL이 있으면 동의 확인 후 진행합니다."></textarea></label>
      <div class="btn-row">
        <button type="submit">스튜디오에서 초안 만들기</button>
        <button type="button" id="sendApi" hidden>Foundry API 채팅 (세션 필요)</button>
      </div>
      <p id="status" class="muted" role="status"></p>
    </form>
    <div class="panel"><h2>최근 요청</h2><ul class="list" id="requests"></ul></div>
  </div>
  <script src="/services/services.js"></script>
  <script>
    const {
      saveProject, readProjects, getApiBase, buildStudioBriefFromWorkRequest,
      saveCoCreationStudioDraft, extractReferenceUrls, stashReferenceConsentResume,
    } = APFHomeServices;

    function renderList() {
      const root = document.getElementById('requests');
      root.replaceChildren();
      const items = readProjects().filter((p) => p.type === 'work-request' || p.co_creation_session_id);
      if (!items.length) {
        root.innerHTML = '<li class="muted">저장된 요청이 없습니다.</li>';
        return;
      }
      for (const item of items.slice(0, 8)) {
        const li = document.createElement('li');
        const link = document.createElement('a');
        if (item.co_creation_session_id) {
          link.href = `/services/site-builder.html?session=${encodeURIComponent(item.co_creation_session_id)}&proposal=${encodeURIComponent(item.co_creation_proposal_id || '')}&project=${encodeURIComponent(item.studio_project_id || '')}`;
          link.textContent = '스튜디오에서 이어하기 →';
        }
        const strong = document.createElement('strong');
        strong.textContent = item.title;
        const meta = document.createElement('span');
        meta.className = 'muted';
        meta.textContent = `${item.scope || 'LANDING'} · ${(item.updated_at || '').slice(0, 10)}`;
        li.append(strong, document.createElement('br'), meta);
        if (link.href) li.append(document.createElement('br'), link);
        root.append(li);
      }
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const message = document.getElementById('message').value.trim();
      const scope = document.getElementById('scope').value;
      const refs = extractReferenceUrls(message);
      const apiBase = getApiBase();
      if (refs.length && apiBase) {
        const sessionId = crypto.randomUUID();
        const proposalId = crypto.randomUUID().replace(/-/g, '').slice(0, 24);
        const brief = buildStudioBriefFromWorkRequest({ title, message, scope });
        const studioProject = saveProject({
          type: 'site',
          title: brief.title,
          brief,
          html: '',
          creation_mode: 'co_creation_linked_studio',
          co_creation_session_id: sessionId,
          co_creation_proposal_id: proposalId,
          publish_ready: false,
        });
        saveCoCreationStudioDraft(sessionId, { brief, proposal_id: proposalId, project_id: studioProject.id });
        const returnUrl = new URL('/services/site-builder.html', window.location.origin);
        returnUrl.searchParams.set('session', sessionId);
        returnUrl.searchParams.set('proposal', proposalId);
        returnUrl.searchParams.set('project', studioProject.id);
        stashReferenceConsentResume({
          title,
          message,
          scope,
          brief,
          session_id: sessionId,
          proposal_id: proposalId,
          project_id: studioProject.id,
          reference_urls: refs,
          return_path: returnUrl.pathname + returnUrl.search,
        });
        document.getElementById('status').textContent =
          '참고 URL이 포함되어 있습니다. 동의 후 스튜디오로 돌아가며 입력 내용을 유지합니다.';
        window.location.href = `${apiBase}/reference-material-consent?return=${encodeURIComponent(returnUrl.toString())}`;
        return;
      }
      const sessionId = crypto.randomUUID();
      const proposalId = crypto.randomUUID().replace(/-/g, '').slice(0, 24);
      const brief = buildStudioBriefFromWorkRequest({ title, message, scope });
      const studioProject = saveProject({
        type: 'site',
        title: brief.title,
        brief,
        html: '',
        creation_mode: 'co_creation_linked_studio',
        co_creation_session_id: sessionId,
        co_creation_proposal_id: proposalId,
        publish_ready: false,
      });
      saveCoCreationStudioDraft(sessionId, { brief, proposal_id: proposalId, project_id: studioProject.id });
      saveProject({
        type: 'work-request',
        title,
        message,
        scope,
        co_creation_session_id: sessionId,
        co_creation_proposal_id: proposalId,
        studio_project_id: studioProject.id,
      });
      document.getElementById('status').textContent = '스튜디오로 이동합니다. 내용은 자동으로 채워집니다.';
      window.location.href =
        `/services/site-builder.html?session=${encodeURIComponent(sessionId)}&proposal=${encodeURIComponent(proposalId)}&project=${encodeURIComponent(studioProject.id)}`;
    });

    const base = getApiBase();
    const sendBtn = document.getElementById('sendApi');
    if (base) {
      sendBtn.hidden = false;
      sendBtn.addEventListener('click', () => { window.location.href = '/services/admin.html#console'; });
    }
    renderList();
  </script>
</body>
</html>
