<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>브랜드 스튜디오 · 아르카온</title><link rel="stylesheet" href="/services/brand-studio.css"></head><body><header><a href="/">ARKAON / BRAND STUDIO</a><a href="/services/account.html">내 작업</a></header><main><section class="editor"><p class="eyebrow">작은 시작에도, 분명한 인상.</p><h1>로고와 명함을<br>함께 다듬으세요.</h1><p>정보를 적고 시안을 골라 보세요. 벡터 도형과 글자로 만드는 규칙 기반 초안입니다.</p><form id="brand"><fieldset><legend>1. 브랜드와 연락처</legend><label>상호·브랜드 이름<input id="businessName" required maxlength="60"></label><label>로고 약자<input id="initials" maxlength="4" placeholder="예: ON"></label><label>소개 문구<input id="tagline" maxlength="100"></label><label>담당자 이름<input id="person" maxlength="40"></label><label>직책<input id="role" maxlength="60"></label><label>이메일<input id="email" type="email" maxlength="120"></label><label>전화<input id="phone" maxlength="40"></label><label>웹사이트<input id="website" type="url" maxlength="240" placeholder="https://"></label><label>주소<input id="address" maxlength="160"></label></fieldset><fieldset><legend>2. 표현 방식</legend><label>로고 시안<select id="style"><option value="orbit">연결 · 원형 심벌</option><option value="frame">신뢰 · 프레임 심벌</option><option value="wordmark">간결 · 워드마크</option></select></label><label>브랜드 색상<input id="accent" type="color" value="#31594c"></label></fieldset><button type="button" id="example">가상 예시로 살펴보기</button><button type="submit">초안 저장 · 이어서 편집</button><p id="status" role="status"></p></form></section><section class="results" aria-label="브랜드 미리보기"><p class="eyebrow">YOUR BRAND, IN CONTEXT</p><h2>하나의 브랜드, 세 가지 쓰임</h2><iframe id="preview" title="로고와 명함 앞뒷면 미리보기" sandbox=""></iframe><ul id="missing"></ul><p>이 브라우저에 저장되는 초안입니다. 상표 유사성·폰트 이용 조건·연락처 확인이 필요합니다. 인쇄용 PDF·도련·색상 교정·공개 게시·AI 이미지 생성은 포함되지 않습니다.</p></section></main><script src="/services/services.js"></script><script src="/services/brand-studio.js"></script></body></html>
