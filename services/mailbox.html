<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>수정·진화 제안 우편함 · 아르카온</title>
  <link rel="stylesheet" href="/services/services.css">
  <link rel="stylesheet" href="/assets/interactions.css">
  <link rel="stylesheet" href="/assets/atelier.css">
  <script src="/assets/interactions.js" defer></script>
</head>
<body class="atelier-workspace"><main class="shell">
  <div class="svc-top"><h1>수정·진화 제안 우편함</h1><a class="svc-home" href="/">← 홈</a></div>
  <p class="muted">아르카온이 남긴 제안을 읽고 다음 작업을 검토하는 공간입니다.</p>
  <section class="panel"><h2>제안 확인</h2>
    <p id="mailboxStatus" role="status">운영 서버 연결 상태를 확인해 주세요.</p>
    <div class="btn-row"><button type="button" id="refreshMailbox">우편함 열기</button><a class="btn" href="/services/account.html">연결 설정</a><a class="btn" id="mailboxConsole" href="/services/admin.html">운영 콘솔</a></div>
    <ul class="list" id="mailboxItems"></ul>
    <div class="btn-row"><button type="button" id="copyMailboxReport" disabled>검토 보고서 복사</button></div>
    <label for="mailboxReport">에테르니언에게 전달할 검토 보고서</label>
    <textarea id="mailboxReport" rows="10" readonly placeholder="우편함 조회에 성공하면 보고서가 표시됩니다."></textarea>
    <p id="mailboxCopyStatus" role="status"></p>
    <p class="muted">보고서에는 표시된 제안의 요약이 포함됩니다. 개인정보·내부 자료를 확인한 뒤 필요한 부분만 대화에 붙여 넣어 주세요. 자동 전송·승인·수정은 수행하지 않습니다.</p>
    <p class="muted">제안 내용은 검토 자료입니다. 읽기만으로 승인되거나 실행되지 않습니다.</p>
  </section>
</main>
<script src="/services/services.js"></script>
<script src="/services/mailbox.js"></script>
</body></html>
