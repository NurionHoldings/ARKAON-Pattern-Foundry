<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>이름@ 개인 페이지 · 아르카온</title>
  <link rel="stylesheet" href="/services/services.css">
  <link rel="stylesheet" href="/assets/interactions.css">
  <link rel="stylesheet" href="/assets/atelier.css">
  <script src="/assets/interactions.js" defer></script>
  <link rel="stylesheet" href="/assets/appearance.css">
  <script src="/assets/appearance.js" defer></script>
  <script src="/assets/header-video.js" defer></script>
</head>
<body class="atelier-workspace" data-space="web">
  <div class="shell atelier-studio">
    <div class="svc-top"><a class="mini-brand" href="/" aria-label="아르카온 홈"><span class="mini-brand-picture" aria-hidden="true"><span class="mini-brand-emblem">A</span><video class="mini-brand-video" data-header-video muted loop playsinline preload="none" tabindex="-1"></video></span><span class="mini-brand-copy"><strong>ARKAON</strong><small>CREATIVE ATELIER</small></span></a><h1>이름@ 개인 페이지</h1><nav class="svc-return-nav" aria-label="페이지 이동"><a class="svc-home" href="/services/" data-service-back>← 이전</a><a class="svc-home" href="/services/">메뉴홈 ↗</a></nav></div>
    <form class="panel" id="form">
      <h2>@ 핸들 페이지</h2>
      <label>핸들 (영문·숫자)<input id="handle" required maxlength="32" pattern="[A-Za-z0-9._-]+" value="creator"></label>
      <label>표시 이름<input id="displayName" maxlength="80" value="크리에이터"></label>
      <label>소개<textarea id="bio" maxlength="800">만드는 것을 좋아합니다.</textarea></label>
      <label>링크 (한 줄에 하나, 선택: 제목|URL)<textarea id="linksText" placeholder="포트폴리오|https://example.com">아르카온|https://arkaonfoundry.netlify.app</textarea></label>
      <label>강조색<input id="accent" type="color" value="#ad79ff"></label>
      <div class="btn-row"><button type="submit">HTML 저장 · 내 작업에 추가</button></div>
    </form>
    <div class="panel preview"><iframe sandbox id="preview" title="개인 페이지 미리보기"></iframe></div>
  </div>
  <script src="/services/services.js"></script>
  <script>
    const {personalPageHtml,downloadText,saveProject}=APFHomeServices;
    const fields=['handle','displayName','bio','linksText','accent'];
    function values(){return Object.fromEntries(fields.map(id=>[id,document.getElementById(id).value]));}
    function render(){document.getElementById('preview').srcdoc=personalPageHtml(values());}
    fields.forEach(id=>document.getElementById(id).addEventListener('input',render));
    document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const v=values();const html=personalPageHtml(v);
      saveProject({type:'personal',title:`@${v.handle}`,html});downloadText(`${v.handle}-page.html`,html);});
    render();
  </script>
<footer class="company-footer">
  <div class="company-footer-inner">
    <a class="company-footer-brand" href="/" aria-label="아르카온 홈">ARKAON<span>상상에 형태를. 가능성에 생명력을.</span></a>
    <div class="company-details"><strong>(주)아르카온</strong><address>주소: 서울 서초구 방배동 952-2, 디엠그레이스서초 1102호</address><p>대표자: 최인석</p></div>
    <nav class="company-footer-nav" aria-label="하단 메뉴"><a href="/services/">서비스 메뉴</a><a href="/services/mailbox.html">제안 우편함</a><a href="/services/admin.html">관리자</a></nav>
    <p class="company-copyright">© (주)아르카온</p>
  </div>
</footer>
</body>
</html>
