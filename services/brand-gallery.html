<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12개 견본에서 시작하는 브랜드 · 아르카온</title><link rel="stylesheet" href="/services/brand-gallery.css"></head><body>
<header><a href="/">ARKAON</a><a href="/services/logo-card.html">이어서 편집하기</a></header><main>
<p class="eyebrow">YOUR BRAND, YOUR DIRECTION</p><h1>눈으로 고르고,<br>우리답게 다듬으세요.</h1><p class="lead">직접 만든 12개 로고와 명함 견본입니다. 마음에 드는 3~4개를 비교한 뒤 하나를 선택하세요.</p>
<form id="gallery-brief"><label>브랜드 이름<input id="businessName" maxlength="60" placeholder="내 사업의 이름" required></label><label>업종<input id="industry" maxlength="80" placeholder="어떤 일을 하나요?"></label><label>제공 서비스<textarea id="services" maxlength="400" rows="2" placeholder="고객에게 제공하는 일을 적어주세요"></textarea></label><label>한 줄 소개<input id="tagline" maxlength="100" placeholder="직접 쓴 문구는 선택 후에도 유지됩니다"></label><label>조금 더 자세한 소개<textarea id="brandIntro" maxlength="400" rows="2"></textarea></label><label>브랜드 색상<input id="accent" type="color" value="#31594c"></label><button type="submit">내 정보로 견본 보기</button></form>
<div class="guide"><p id="shortlist-count" aria-live="polite"></p><p>견본은 자체 규칙으로 생성한 초안입니다. 상표 등록 가능성이나 전 세계 유일성을 보증하지 않습니다.</p></div>
<section id="gallery-grid" aria-label="자체 생성 로고와 명함 견본 12개"></section>
<div class="continue"><button id="continue-editing" disabled>선택한 안의 내용·디자인 다듬기</button><p id="gallery-status" role="status" aria-live="polite"></p></div>
</main><script src="/services/services.js"></script><script src="/services/brand-editing.js"></script><script src="/services/brand-concepts.js"></script><script src="/services/brand-studio.js"></script><script src="/services/brand-gallery.js"></script></body></html>
