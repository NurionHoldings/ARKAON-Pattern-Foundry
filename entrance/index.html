<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b16"><title>ARKAON | 각성 진입 화면</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 38%,#193451,#050b16 60%);color:#eaf7ff;overflow:hidden}
main{min-height:100dvh;display:grid;place-items:center;padding:24px}.scene{text-align:center;position:relative;isolation:isolate;width:min(100%,700px)}.scene:before{content:"";position:absolute;inset:-15vh -30vw;background:radial-gradient(circle at center,#2773b022,transparent 60%);z-index:-1;animation:breathe 6s ease-in-out infinite}@keyframes breathe{50%{opacity:.4;transform:scale(1.08)}}
.face{width:min(58vw,340px);height:min(76vw,430px);min-width:230px;min-height:290px;margin:auto;position:relative;border-radius:46% 46% 43% 43%;background:linear-gradient(105deg,#172b3b 3%,#7494a5 29%,#1d394f 55%,#07121f 94%);box-shadow:inset -24px -16px 55px #030811,0 0 90px #1389d633;border:1px solid #6fcfff66;transform:rotate(-5deg);transition:transform 1.3s ease}
.face:after{content:"";position:absolute;left:50%;bottom:-19%;width:82%;height:26%;border-radius:46% 46% 12% 12%;transform:translateX(-50%);background:linear-gradient(90deg,#06101e,#244962 50%,#07111e);z-index:-1;box-shadow:0 0 45px #25a8e022}.face:before{content:"";position:absolute;inset:5% 10%;border-radius:inherit;border-left:1px solid #a7f5ff55;border-right:1px solid #a7f5ff22;pointer-events:none}
.eyes{position:absolute;top:43%;width:100%;display:flex;justify-content:space-evenly}.eye{width:28%;height:9px;border-top:3px solid #a8d7e4;border-radius:50%;background:#081827;overflow:hidden;transition:height .6s,box-shadow .6s}.iris{width:43%;height:95%;margin:auto;border-radius:50%;background:radial-gradient(circle,#030b14 0 23%,#46e9ff 27%,#0870ac 49%,#a6faff 57%,#062336 69%);box-shadow:0 0 22px #53dfff}
.nose{position:absolute;left:48%;top:56%;width:4%;height:12%;border-right:1px solid #b8e7ee55;border-bottom:1px solid #b8e7ee55;border-radius:0 0 70% 0;transform:rotate(-5deg)}.mouth{position:absolute;top:72%;left:42%;width:16%;height:8px;border-bottom:2px solid #a9d4e5;border-radius:50%;transition:all .7s}
.awake .face{transform:rotate(0) scale(1.035)}.awake .iris{animation:irisPulse 1.1s ease-out both}@keyframes irisPulse{0%{filter:brightness(.4)}60%{filter:brightness(2.5)}100%{filter:brightness(1.25)}}.awake .eye{height:43px;box-shadow:0 0 24px #19bdf0}.awake .mouth{height:15px;border-bottom-width:3px}
.portal{position:fixed;left:50%;top:46%;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#010811 5%,#0c84bc 26%,#72f6ff 44%,#07101e 58%);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:10}
.entering .portal{animation:zoom 1.6s ease-in forwards}.entering .scene{animation:sceneOut 1.3s ease-in forwards}@keyframes sceneOut{to{transform:scale(2.3);opacity:0}}@keyframes zoom{0%{transform:translate(-50%,-50%) scale(0)}100%{transform:translate(-50%,-50%) scale(550)}}
h1{letter-spacing:.3em;font-size:clamp(1.5rem,4vw,2.6rem);margin:28px 0 8px}p{color:#b4c7d8}button{font:inherit;transition:background .2s,transform .2s}button:hover{background:#1a5279;transform:translateY(-1px)}button:disabled{opacity:.6;cursor:default}button{border:1px solid #66caff;border-radius:999px;padding:12px 22px;background:#103653;color:white;font-weight:700;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ffdb74;outline-offset:4px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px}a{color:#b4e9ff}#status{min-height:1.5em}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><div class="scene" id="scene">
<div class="face" aria-hidden="true"><div class="eyes"><div class="eye"><div class="iris"></div></div><div class="eye"><div class="iris"></div></div></div><div class="nose"></div><div class="mouth"></div></div>
<h1>ARKAON</h1><p>당신의 생각이 새로운 세계를 깨웁니다.</p><p id="status" role="status">생각하는 지능, 당신의 부름을 기다립니다.</p>
<div class="controls"><button id="awaken">아르카온 깨우기</button><button id="voice" type="button">음성으로 부르기</button><a id="skip" href="https://arkaonfoundry.netlify.app/">인트로 건너뛰기</a></div>
</div></main><div class="portal" aria-hidden="true"></div>
<script>
'use strict';
const HOME='https://arkaonfoundry.netlify.app/';
// Keep this entry at a separate URL from HOME to prevent redirect loops.
const target=new URL(HOME);if(location.origin===target.origin&&location.pathname==='/'){document.documentElement.dataset.entryRouteError='true';}
const scene=document.getElementById('scene'),status=document.getElementById('status');
let started=false,recognition=null;const awakenButton=document.getElementById('awaken'),voiceButton=document.getElementById('voice');
function goHome(){if(location.origin===target.origin&&location.pathname==='/'){status.textContent='진입 경로 설정을 확인해 주세요.';return}location.assign(HOME)}
function enter(){
 if(started)return;started=true;awakenButton.disabled=true;voiceButton.disabled=true;
 if(recognition){try{recognition.stop()}catch(_){}}
 scene.classList.add('awake');status.textContent='당신을 인식했습니다. 아르카온으로 연결합니다.';
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(()=>goHome(),250);return}
 setTimeout(()=>{document.body.classList.add('entering');setTimeout(()=>goHome(),1600)},1100);
}
awakenButton.addEventListener('click',enter);
voiceButton.addEventListener('click',()=>{if(started)return;
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){status.textContent='이 브라우저는 음성 호출을 지원하지 않습니다. 깨우기 버튼을 사용하세요.';return}
 try{
 recognition=new SpeechRecognition();recognition.lang='ko-KR';recognition.interimResults=false;recognition.maxAlternatives=1;
 recognition.onresult=e=>{const said=e.results[0][0].transcript;if(/아르카온|시작|안녕/.test(said))enter();else status.textContent='“아르카온”이라고 말씀해 주세요.'};
 recognition.onerror=()=>{if(!started)status.textContent='마이크 사용이 제한되었습니다. 깨우기 버튼을 이용하세요.'};
 recognition.start();status.textContent='듣고 있습니다. “아르카온”이라고 말씀해 주세요.';
 }catch(_){status.textContent='음성 호출을 시작할 수 없습니다. 깨우기 버튼을 이용하세요.'}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&recognition){try{recognition.stop()}catch(_){}}});
</script></body></html>
