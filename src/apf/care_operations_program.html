<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"><title>해온 업무 프로그램 미리보기</title><style>body{font:16px/1.65 system-ui,sans-serif;background:#faf8f1;color:#304638;margin:0}main{max-width:1100px;padding:30px 22px;margin:auto}section{background:#fff;padding:24px;border:1px solid #dce1d2;border-radius:16px;margin:22px 0}nav{display:flex;gap:10px;flex-wrap:wrap}button{padding:12px 18px;cursor:pointer;background:#eef2e7;border:1px solid #acb99d;border-radius:9px}button.active{background:#3c563f;color:white}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}label{display:flex;flex-direction:column;gap:6px}input,select{font:inherit;padding:10px;border:1px solid #bac6ad;border-radius:6px;min-width:0}pre{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}p[role=status]{color:#86531c;min-height:24px}</style><main><p>ARKAON · CARE OPERATIONS GENERATOR</p><h1></h1><p>생성한 프로그램의 동작을 확인하는 독립 미리보기입니다. 데이터는 열린 창의 메모리에만 남으며 닫으면 사라집니다. 실명·주민번호·진료정보를 입력하지 마세요. 실제 운영에는 서버 인증·보안 저장·백업 연결이 필요합니다.</p><nav></nav><section><h2 id="module-title"></h2><form></form><p role="status"></p></section><section><h2>집계·점검</h2><pre id="summary"></pre></section><section><h2>기록</h2><div id="rows" class="scroll"></div><button id="export">현재 기록 JSON 내보내기</button></section><p>요양급여는 사용자가 확인한 요율의 산술 초안입니다. 법정 요율 조회·자격 판정·세무 신고·공단 제출·외부 AI 호출은 실행하지 않습니다.</p></main><script id="config" type="application/json">__APF_CONFIG_JSON__</script><script>
'use strict';const config=JSON.parse(document.querySelector('#config').textContent),entries=[];let module=config.modules[0];const names={office:'사무·일정',accounting:'회계·증빙',benefit:'요양급여 검토',food_inventory:'식자재 수불',supplies_inventory:'기타 재고'};const $=s=>document.querySelector(s);$('h1').textContent=config.brand+' · 업무 관리';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const field=(name,label,type='text',attrs='required')=>`<label>${label}<input name="${name}" type="${type}" ${attrs}></label>`;const choose=(name,label,values)=>`<label>${label}<select name="${name}">${values.map(v=>`<option>${v}</option>`).join('')}</select></label>`;const inventory=()=>module.endsWith('inventory');
function balances(){const rows=new Map();for(const e of entries.filter(e=>e.module.endsWith('inventory'))){const key=e.module+'|'+e.code+'|'+e.lot;const r=rows.get(key)||{module:e.module,code:e.code,lot:e.lot,unit:e.unit,expiry:e.expiry,quantity:0};r.quantity+=(e.direction==='입고'?1:-1)*Math.round(e.quantity*1000);rows.set(key,r)}return [...rows.values()].map(r=>({...r,quantity:r.quantity/1000}))}
function render(){const nav=$('nav');nav.innerHTML=config.modules.map(id=>`<button data-module="${id}" class="${module===id?'active':''}">${names[id]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{module=b.dataset.module;render()});$('#module-title').textContent=names[module];let html=field('date','기록일','date',`required value="${new Date().toISOString().slice(0,10)}"`);
if(module==='office')html+=field('title','업무명')+field('due','기한','date')+choose('status','상태',['예정','진행','완료']);
if(module==='accounting')html+=choose('direction','수입·지출',['수입','지출'])+field('amount','금액(원)','number','required min="1" max="100000000000" step="1"')+field('evidence','증빙 번호');
if(module==='benefit')html+=field('resident','입소자 코드','text','required pattern="[A-Za-z0-9_-]{1,30}"')+field('month','대상 월','month')+field('days','일수','number','required min="1" max="31" step="1"')+field('dailyFee','확인한 일당 요율(원)','number','required min="1" max="10000000" step="1"')+field('copay','확인한 본인부담률(%)','number','required min="0" max="100" step="0.01"')+field('extras','비급여(원)','number','required min="0" max="100000000" step="1" value="0"')+field('evidence','요율 근거·적용일');
if(inventory())html+=field('code','품목 코드','text','required pattern="[A-Za-z0-9_-]{1,40}"')+field('lot','로트')+field('unit','단위')+choose('direction','입출고',['입고','출고'])+field('quantity','수량','number','required min="0.001" max="1000000" step="0.001"')+field('expiry','소비기한','date',module==='food_inventory'?'required':'');
$('form').innerHTML=html+'<button>기록 추가</button>';const rows=entries.filter(e=>e.module===module);$('#rows').innerHTML=rows.length?'<table><tbody>'+rows.map(e=>'<tr>'+Object.entries(e).filter(([k])=>k!=='module').map(([k,v])=>`<td>${esc(k)}: ${esc(v)}</td>`).join('')+'</tr>').join('')+'</tbody></table>':'등록된 기록 없음';const ac=entries.filter(e=>e.module==='accounting'),be=entries.filter(e=>e.module==='benefit');$('#summary').textContent=JSON.stringify({records:entries.length,income:ac.filter(e=>e.direction==='수입').reduce((a,e)=>a+e.amount,0),expense:ac.filter(e=>e.direction==='지출').reduce((a,e)=>a+e.amount,0),benefitDraftTotal:be.reduce((a,e)=>a+e.gross,0),stock:balances()},null,2);$('form').onsubmit=save;}
function num(v,min,max,whole=false){const n=Number(v);if(!Number.isFinite(n)||n<min||n>max||(whole&&!Number.isSafeInteger(n)))throw Error('숫자 범위를 확인하세요.');return n}
function save(ev){ev.preventDefault();try{if(entries.length>=10000)throw Error('미리보기 기록 한도입니다.');const e={module,...Object.fromEntries(new FormData(ev.target))};for(const [k,v]of Object.entries(e))if(typeof v==='string'&&v.length>300)throw Error('입력 문구가 너무 깁니다.');if(module==='accounting')e.amount=num(e.amount,1,100000000000,true);if(module==='benefit'){if(!/^[A-Za-z0-9_-]{1,30}$/.test(e.resident)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(e.month))throw Error('코드와 월을 확인하세요.');const maxDays=new Date(Number(e.month.slice(0,4)),Number(e.month.slice(5)),0).getDate();e.days=num(e.days,1,maxDays,true);e.dailyFee=num(e.dailyFee,1,10000000,true);e.copay=num(e.copay,0,100);e.extras=num(e.extras,0,100000000,true);const same=entries.filter(r=>r.module==='benefit'&&r.month===e.month);if(same.some(r=>r.resident===e.resident))throw Error('동일 입소자·월 중복입니다.');if(same.length>=config.capacity)throw Error('계획 정원 초과입니다.');e.gross=e.days*e.dailyFee;e.residentShare=Math.round(e.gross*e.copay/100);e.insurer=e.gross-e.residentShare;e.residentTotal=e.residentShare+e.extras;e.review='검토 초안·미제출'}if(inventory()){e.quantity=num(e.quantity,.001,1000000);if(Math.abs(e.quantity*1000-Math.round(e.quantity*1000))>1e-6)throw Error('수량은 소수 셋째 자리까지입니다.');if(e.code.includes('|')||e.lot.includes('|'))throw Error('코드·로트에 |는 사용할 수 없습니다.');const same=entries.filter(r=>r.module===module&&r.code===e.code);if(same.some(r=>r.unit!==e.unit))throw Error('같은 품목 단위를 유지하세요.');if(same.some(r=>r.lot===e.lot&&r.expiry!==e.expiry))throw Error('같은 로트 소비기한을 유지하세요.');const stock=same.filter(r=>r.lot===e.lot).reduce((a,r)=>a+(r.direction==='입고'?1:-1)*Math.round(r.quantity*1000),0);if(e.direction==='출고'&&Math.round(e.quantity*1000)>stock)throw Error('로트 재고를 초과해 출고할 수 없습니다.')}entries.push(e);render();$('[role=status]').textContent='기록했습니다. 창을 닫기 전 내보내기로 보관하세요.'}catch(error){$('[role=status]').textContent=error.message}}
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({configuration:config,entries},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='haeon-operations-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
