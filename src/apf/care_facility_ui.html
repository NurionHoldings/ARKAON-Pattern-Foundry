<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 요양원 설계 검산</title><style>body{max-width:1050px;margin:30px auto;padding:20px;background:#0c1823;color:#edf3f1;font:16px/1.7 system-ui}a{color:#9ed5ff}textarea{width:100%;height:360px;box-sizing:border-box;background:#142636;color:#fff;padding:14px;border:1px solid #537070;border-radius:8px;font:14px/1.5 monospace}button,select{padding:12px;margin:8px 8px 8px 0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142636;padding:18px;border-radius:8px}#confirm{background:#bde6c6}button:disabled{opacity:.45}.notice{padding:16px;background:#233b43;border-radius:8px}</style><a href="/console">← ARKAON 콘솔</a><h1>요양원 요구 확인 → 검산 → 이미지 요청</h1><p class="notice">실 수·정원·화장실 수와 면적 예산을 계산합니다. 법적 적합성과 실측 배치 가능성은 판정하지 않습니다. 외부 이미지 서비스 호출·자동 배포·공식 자산 승격은 실행하지 않습니다.</p><p>프로젝트 예시 49명·22실을 수정하거나 다른 요구사항을 입력하세요. 면적은 설계 목표이며 실측값과 구분합니다.</p><label>요구사항 JSON<textarea id="brief" spellcheck="false"></textarea></label><label>생성 장면 <select id="scene"><option value="overview">전체 조감도</option><option value="bedroom">생활침실 예시</option><option value="staff_support">직원 휴게·탈의</option><option value="kitchen_bathing">조리·목욕 지원</option></select></label><label>침실 예시 정원 <select id="occupancy"><option value="1">1명</option><option value="2" selected>2명</option><option value="3">3명</option><option value="4">4명</option></select></label><div><button id="check">1 요구사항 검산</button><button id="confirm" disabled>2 이 구성으로 요청문 만들기</button><button id="download" disabled>요청 패킷 다운로드</button></div><p id="state" role="status"></p><pre id="result">검산 전입니다.</pre><script>
const sample={"target_residents": 49, "room_types": [{"occupancy": 1, "count": 7, "ensuite_wc": true, "bedroom_target_m2": 12, "toilet_target_m2": 5.5}, {"occupancy": 2, "count": 7, "ensuite_wc": true, "bedroom_target_m2": 20, "toilet_target_m2": 5.5}, {"occupancy": 3, "count": 4, "ensuite_wc": true, "bedroom_target_m2": 28, "toilet_target_m2": 5.5}, {"occupancy": 4, "count": 4, "ensuite_wc": true, "bedroom_target_m2": 36, "toilet_target_m2": 5.5}], "ensuite_each_room": true, "kitchen_pyeong": 15, "support_spaces": [{"kind": "living_dining", "target_m2": 50}, {"kind": "program", "target_m2": 40}, {"kind": "physical_occupational_therapy", "target_m2": 25}, {"kind": "nursing", "target_m2": 18}, {"kind": "caregiver_work", "target_m2": 18}, {"kind": "office_counseling", "target_m2": 20}, {"kind": "volunteer", "target_m2": 10}, {"kind": "male_bathing", "target_m2": 18}, {"kind": "female_bathing", "target_m2": 18}, {"kind": "food_storage", "target_m2": 8}, {"kind": "clean_linen", "target_m2": 10}, {"kind": "dirty_utility", "target_m2": 8}, {"kind": "laundry_drying", "target_m2": 12}, {"kind": "staff_rest", "target_m2": 16}, {"kind": "staff_changing", "target_m2": 16}, {"kind": "public_toilet", "target_m2": 12}, {"kind": "clean_utility", "target_m2": 8}, {"kind": "evacuation_reserve", "target_m2": 30}, {"kind": "circulation_reserve", "target_m2": 180}, {"kind": "structure_reserve", "target_m2": 100}], "available_area_m2": null};const $=id=>document.getElementById(id);$('brief').value=JSON.stringify(sample,null,2);let digest=null,packet=null;
function reset(){digest=null;packet=null;$('confirm').disabled=true;$('download').disabled=true;$('state').textContent='입력이 변경되었습니다. 다시 검산하세요.';$('result').textContent='검산 전입니다.'}
for(const id of ['brief','scene','occupancy'])$(id).addEventListener('input',reset);
function csrf(){const item=document.cookie.split('; ').find(x=>x.startsWith('apf_console_csrf='));return item?decodeURIComponent(item.split('=').slice(1).join('=')):''}
async function plan(confirm){try{const brief=JSON.parse($('brief').value);const snapshot=JSON.stringify([brief,$('scene').value,$('occupancy').value]);$('check').disabled=true;$('confirm').disabled=true;const response=await fetch('/v1/console/care-facility/plan',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify({brief,scene:$('scene').value,bedroom_occupancy:Number($('occupancy').value),confirmed_digest:confirm?digest:null})});const value=await response.json();if(!response.ok)throw Error(JSON.stringify(value.detail));if(snapshot!==JSON.stringify([JSON.parse($('brief').value),$('scene').value,$('occupancy').value]))return reset();packet=value;digest=value.brief_digest;$('result').textContent=JSON.stringify(value,null,2);$('state').textContent=`${value.room_count}실 · ${value.computed_residents}명 · 화장실 ${value.ensuite_wc_count}개 / ${value.status}`;$('confirm').disabled=Boolean(value.blockers.length);$('download').disabled=!value.image_prompt}catch(e){reset();$('state').textContent=e.message}finally{$('check').disabled=false}}
$('check').onclick=()=>plan(false);$('confirm').onclick=()=>plan(true);$('download').onclick=()=>{if(!packet?.image_prompt)return;const url=URL.createObjectURL(new Blob([JSON.stringify(packet,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='care-facility-image-request.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
