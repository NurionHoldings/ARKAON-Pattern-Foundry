<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 형식 시안</title><style>
:root{font:16px system-ui;color:#edf4ff;background:#07111f}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:24px}a{color:#8bc9ff}.panel{background:#122238;border:1px solid #35506a;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;background:#071522;color:white;border:1px solid #50708b;border-radius:8px;padding:11px;font:inherit}button{background:#1d6b9d;border:0;color:#fff;padding:12px 18px;border-radius:9px;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5}small,.muted{color:#b7cadc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.preview{border:1px solid #59738e;border-radius:14px;padding:20px;min-height:270px;background:linear-gradient(155deg,#123352,#122238)}.preview strong{font-size:1.5rem;display:block;margin:1.5rem 0}.pill{background:#534324;padding:5px 10px;border-radius:20px}#message{min-height:24px;color:#ffd166}fieldset{border:1px solid #50708b;border-radius:12px;margin:16px 0}legend{padding:0 8px}@media(max-width:600px){body{padding:12px}}
</style></head><body><a href="/console">← 관리 화면</a><h1>인기 제작 형식에서 영감 얻기</h1><p>내 자산의 목적과 DNA에 맞춰 구성 원리만 재설계합니다. 출처의 영상·음원·템플릿 파일은 가져오지 않습니다.</p><div class="panel"><h2>1. 자산과 관찰 근거</h2><label>내 자산<select id="asset"></select></label><label>목적<input id="purpose" maxlength="120" placeholder="예: 상담 예약 안내"></label><label>대상 고객<input id="audience" maxlength="120" placeholder="예: 첫 방문 고객"></label><label>내 브랜드 문구<input id="brand" maxlength="120" placeholder="예: 필요한 서비스를 한눈에"></label><fieldset><legend>공개 자료 관찰 기록</legend><label>플랫폼<select id="platform"><option value="youtube">YouTube</option><option value="tiktok">TikTok</option><option value="instagram">Instagram</option><option value="capcut">CapCut</option></select></label><label>공식 플랫폼의 출처 URL<input id="url" type="url" placeholder="https://..."></label><label>관찰 시각<input id="observed" type="datetime-local"></label><label>지역<input id="region" value="KR"></label><label>업종·분류<input id="category" placeholder="예: 음식점"></label><label>확인 가능한 공개 지표의 범위<input id="scope" placeholder="예: 공개 조회수, 같은 지역·분류"></label><label>직접 관찰한 신호<input id="signal" placeholder="예: 화면에 표시된 조회수; 검증 전 수기 기록"></label><label>일반 구성 원리<input id="principle" placeholder="예: 시작 부분에서 혜택을 명료하게 제시"></label><label>권리 확인<select id="rights"><option value="reference_only">참고만 사용, 원본 요소 이용 금지</option><option value="commercial_use_verified">별도 상업 이용 권리 확인 (이번 시안에는 원본 미사용)</option></select></label></fieldset><p class="muted">수동 기록이며 최신 인기 순위를 자동 검증하지 않습니다. 최근 30일 안의 관찰 여부를 별도로 표시합니다.</p><button id="create">독립 시안 3개 보기</button><p id="message" role="status"></p></div><div id="result" hidden><h2>2. 시안 미리보기</h2><p id="evidence"></p><div class="grid" id="variants"></div><p>승인은 이 추천 시안의 선택을 기록합니다. 원본 자산 변경·외부 게시·배포는 별도 단계입니다.</p></div><script>
const $=id=>document.getElementById(id);let current=null;const csrf=()=>decodeURIComponent((document.cookie.split('; ').find(x=>x.startsWith('apf_console_csrf='))||'').split('=').slice(1).join('='));
async function load(){const groups=[['site_draft','/v1/console/site-drafts','draft_id'],['logo_draft','/v1/console/logo-drafts','draft_id'],['business_card','/v1/console/business-cards','card_id'],['platform_dialogue','/v1/console/platform-dialogues','dialogue_id']];for(const [kind,url,id] of groups){try{const r=await fetch(url);if(!r.ok)continue;for(const x of await r.json()){if(!x.intent_dna)continue;const option=new Option(`${kind} · ${x.name||x.draft_id||x.card_id||x.dialogue_id}`,JSON.stringify({kind,id:x[id]}));$('asset').add(option)}}catch{}}if(!$('asset').length)$('message').textContent='intent·DNA가 있는 자산을 먼저 생성하세요.'}
function field(id){return $(id).value.trim()}function node(tag,value){const x=document.createElement(tag);x.textContent=value;return x}
$('create').onclick=async()=>{try{const selected=JSON.parse(field('asset'));const routes={site_draft:'/v1/console/site-drafts/',logo_draft:'/v1/console/logo-drafts/',business_card:'/v1/console/business-cards/',platform_dialogue:'/v1/console/platform-dialogues/'};const r=await fetch(routes[selected.kind]+encodeURIComponent(selected.id));if(!r.ok)throw Error('자산을 확인할 수 없습니다');const asset=await r.json(),identity=asset.intent_dna,revision=asset.revisions.at(-1);const payload={artifact_type:selected.kind,record_id:selected.id,asset_id:identity.asset_id,source_revision_digest:revision.revision_digest,intent_digest:identity.intent_digest,dna_digest:identity.dna_digest,purpose:field('purpose'),audience:field('audience'),brand_message:field('brand'),evidence:[{platform:field('platform'),url:field('url'),observed_at:new Date(field('observed')).toISOString(),region:field('region'),category:field('category'),metric_scope:field('scope'),public_signal:field('signal'),principle:field('principle'),rights_status:field('rights')}]};const reply=await fetch('/v1/console/format-proposals',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify(payload)});const result=await reply.json();if(!reply.ok)throw Error(JSON.stringify(result.detail));current=result;$('result').hidden=false;$('variants').replaceChildren();$('evidence').textContent=`${payload.evidence[0].platform} · ${payload.evidence[0].region} · ${payload.evidence[0].observed_at} · 인기 검증 불가 · 원본 요소 미사용 · 출처: ${payload.evidence[0].url}`;for(const v of result.variants){const box=node('article','');box.className='panel';const view=node('div','');view.className='preview';view.append(node('small',v.preview.aspect_ratio),node('strong',v.preview.headline),node('p',v.preview.description),node('p',v.preview.audience));box.append(node('h3',v.title),view,node('p',v.why));for(const [decision,label] of [['APPROVE','이 시안 승인'],['REJECT','시안 거절']]){const b=node('button',label);b.onclick=()=>decide(v.id,decision);box.append(b)}$('variants').append(box)}$('message').textContent='시안이 저장됐습니다. 직접 확인한 뒤 결정하세요.'}catch(e){$('message').textContent=e.message}};
async function decide(variant_id,decision){if(!current||!confirm('이 추천 시안에 대한 결정을 기록하시겠습니까?'))return;const r=await fetch(`/v1/console/format-proposals/${encodeURIComponent(current.proposal_id)}/decision`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify({proposal_digest:current.proposal_digest,variant_id,decision})});const body=await r.json();$('message').textContent=r.ok?`결정 기록 완료: ${body.recommendation_revision_digest}`:JSON.stringify(body.detail);if(r.ok)for(const b of $('variants').querySelectorAll('button'))b.disabled=true}
load();
</script></body></html>
