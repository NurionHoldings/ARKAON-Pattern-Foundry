<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 플랫폼 이미지 대화</title><style>
:root{color-scheme:dark;background:#07111f;color:#edf4ff;font:16px system-ui;--line:#2b405a;--panel:#101d2e;--blue:#53adff;--green:#42d392}*{box-sizing:border-box}body{max-width:1180px;margin:auto;padding:1rem}header,.actions{display:flex;justify-content:space-between;gap:.7rem;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:300px 1fr;gap:1rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:1rem}label{display:block;margin:.7rem 0}input,textarea{width:100%;padding:.7rem;background:#07111f;color:#fff;border:1px solid var(--line);border-radius:8px}button{padding:.7rem 1rem;background:#24415f;color:#fff;border:1px solid #4b7299;border-radius:9px}.primary{background:#147a50;border-color:var(--green)}img{display:block;width:100%;background:#07111f;border:1px solid var(--line);border-radius:12px}.page-preview{display:block;max-width:100%;height:690px;margin:12px auto 20px;border:1px solid var(--line);border-radius:14px;background:#fff}.actions button[aria-pressed=true]{background:#147a50;border-color:var(--green)}.muted{color:#adbed2}.digest{font:12px ui-monospace;overflow-wrap:anywhere}.checks label{display:flex;gap:.5rem}.checks input{width:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}button{min-height:48px;flex:1}}
</style></head><body><header><div><h1>플랫폼 이미지 대화</h1><p class="muted">말로 설명하고, 화면 이미지로 확인하고, 이해한 명세만 확정합니다.</p></div><a href="/console">승인 화면으로 돌아가기</a></header><div class="grid"><aside><section class="card"><h2>새 플랫폼</h2><form id="create"><label>플랫폼 이름<input id="name" required maxlength="120"></label><label>목적<textarea id="purpose" required maxlength="2000"></textarea></label><label>주요 이용자(줄바꿈)<textarea id="audience" required></textarea></label><label>필요 기능(줄바꿈)<textarea id="capabilities" required></textarea></label><label>제약사항(줄바꿈)<textarea id="constraints"></textarea></label><button class="primary">대화 시작</button></form></section><section class="card"><h2>진행 목록</h2><div id="list"></div></section></aside><main><section class="card" id="detail"><h2>플랫폼을 선택하세요</h2></section></main></div><script>
const el=(t,s,c)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=String(s);if(c)n.className=c;return n};const lines=id=>document.querySelector(id).value.split('\n').map(x=>x.trim()).filter(Boolean);const csrf=()=>{const x=document.cookie.split('; ').find(v=>v.startsWith('apf_console_csrf='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):''};async function api(url,options={}){options.headers={...(options.headers||{}),'X-CSRF-Token':csrf()};const r=await fetch(url,options),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||'요청 실패');return b}
async function load(){const items=await api('/v1/console/platform-dialogues'),root=document.querySelector('#list');root.replaceChildren();for(const item of items){const b=el('button',`${item.name} · ${item.state}`);b.addEventListener('click',()=>show(item.dialogue_id));root.append(b)}if(!items.length)root.append(el('p','진행 중인 대화가 없습니다.','muted'))}
async function show(id){const d=await api(`/v1/console/platform-dialogues/${id}`),root=document.querySelector('#detail');root.replaceChildren(el('h2',d.name),el('p',`상태: ${d.state}`),el('p',d.brief.purpose),el('p',`요구사항 digest: ${d.brief_digest}`,'digest'));if(d.revisions.length){const latest=d.revisions.at(-1),img=document.createElement('img');img.alt=`${d.name} 화면 설계 버전 ${latest.revision_number}`;img.src=`/v1/console/platform-dialogues/${id}/revisions/${latest.revision_number}/preview.svg`;root.append(el('h3','화면 구성도'),img,el('p',latest.change_summary),el('p',`이미지: ${latest.image_digest}`,'digest'));const pageTools=el('div',undefined,'actions');pageTools.setAttribute('role','group');pageTools.setAttribute('aria-label','실제 화면 시안 선택');const home=el('button','홈 화면'),detail=el('button','상세 화면'),desktop=el('button','데스크톱'),mobile=el('button','모바일');const pageFrame=document.createElement('iframe');pageFrame.className='page-preview';pageFrame.sandbox='';let activePage='home',activeDevice='desktop';const updatePage=()=>{pageFrame.src=`/v1/console/platform-dialogues/${encodeURIComponent(id)}/revisions/${latest.revision_number}/page/${activePage}.html`;pageFrame.style.width=activeDevice==='mobile'?'390px':'100%';pageFrame.title=`${d.name} ${activePage==='home'?'홈':'상세'} 화면 ${activeDevice==='mobile'?'모바일':'데스크톱'} 시안`;home.setAttribute('aria-pressed',String(activePage==='home'));detail.setAttribute('aria-pressed',String(activePage==='detail'));desktop.setAttribute('aria-pressed',String(activeDevice==='desktop'));mobile.setAttribute('aria-pressed',String(activeDevice==='mobile'))};home.onclick=()=>{activePage='home';updatePage()};detail.onclick=()=>{activePage='detail';updatePage()};desktop.onclick=()=>{activeDevice='desktop';updatePage()};mobile.onclick=()=>{activeDevice='mobile';updatePage()};pageTools.append(home,detail,desktop,mobile);updatePage();root.append(el('h3','홈·상세 화면 시안'),el('p','기능 연결 전 화면 구성 시안입니다. 상세 화면 명세가 없으면 미작성 안내를 표시합니다.','muted'),pageTools,pageFrame);if(d.state==='OWNER_REVIEW_REQUIRED'){const feedback=el('textarea');feedback.placeholder='바꾸고 싶은 화면과 이유를 구체적으로 적어주세요.';const revise=el('button','수정 요청');revise.onclick=async()=>{await api(`/v1/console/platform-dialogues/${id}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision_digest:latest.revision_digest,instruction:feedback.value})});await show(id);await load()};const checks=el('div',undefined,'checks'),items={purpose:'플랫폼 목적',audience:'주요 이용자',screen_flow:'화면과 이용 흐름',data_permissions:'수집 데이터와 권한',cost_and_payment:'비용·결제·정산 구조'};for(const [v,l] of Object.entries(items)){const label=el('label'),input=document.createElement('input');input.type='checkbox';input.value=v;label.append(input,el('span',l));checks.append(label)}const confirm=el('button','모두 이해하고 확인','primary');confirm.onclick=async()=>{const selected=[...checks.querySelectorAll('input:checked')].map(x=>x.value);await api(`/v1/console/platform-dialogues/${id}/understanding`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision_digest:latest.revision_digest,confirmed_items:selected})});await show(id);await load()};root.append(el('h3','수정 대화'),feedback,revise,el('h3','최종 이해 확인'),checks,confirm)}}if(d.state==='UNDERSTANDING_CONFIRMED'){const seal=el('button','최종 플랫폼 명세 봉인','primary');seal.onclick=async()=>{const m=await api(`/v1/console/platform-dialogues/${id}/seal`,{method:'POST'});alert(`명세가 봉인되었습니다.\n${m.manifest_digest}\n구현·배포는 아직 승인되지 않았습니다.`);await show(id);await load()};root.append(seal)}}
document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();const body={name:document.querySelector('#name').value,purpose:document.querySelector('#purpose').value,audience:lines('#audience'),required_capabilities:lines('#capabilities'),constraints:lines('#constraints')};const d=await api('/v1/console/platform-dialogues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await load();await show(d.dialogue_id)});load().catch(e=>alert(e.message));
</script></body></html>
