<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 마컬 템플릿 만들기</title><style>
:root{font:16px system-ui;color:#eff5ff;background:#091321}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:24px}a{color:#9bc7ff}.grid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:20px}.panel{background:#13243a;border:1px solid #37506a;border-radius:18px;padding:24px}label{display:block;margin:14px 0}input,textarea{width:100%;background:#0a1728;border:1px solid #56708a;color:white;border-radius:8px;padding:12px;font:inherit}textarea{min-height:90px}button{background:#45be91;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.muted{color:#b5c7d9}.menu{border:1px solid #57718b;padding:12px;border-radius:9px;margin:8px 0}.digest{overflow-wrap:anywhere;font:12px ui-monospace;color:#add4c2}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><a href="/console">← 아르카온 콘솔</a><h1>마컬 전화응대 템플릿</h1><p class="muted">내 소개와 통화 중 함께 볼 메뉴를 만듭니다. 현재는 검토용 초안을 생성합니다. 전화 연결과 공개 배포는 아직 지원하지 않습니다.</p><div class="grid"><form class="panel" id="builder"><h2>내용 입력</h2><label>주소 이름 (영문 소문자)<input name="slug" required pattern="[a-z][a-z0-9-]*" maxlength="40" value="my-intro"></label><label>표시할 이름<input name="display_name" required maxlength="80"></label><label>소개<textarea name="introduction" required maxlength="500"></textarea></label><label>용건 선택지 (한 줄씩)<textarea name="purpose_prompts" required>상담 요청&#10;자료 요청</textarea></label><label>자료 제목 (한 줄씩)<textarea name="material_titles"></textarea></label><label><input type="checkbox" name="allow_call_request" checked style="width:auto"> 통화 요청 메뉴 표시</label><button>초안 생성</button></form><section class="panel" aria-live="polite"><h2>미리보기</h2><div id="preview" class="muted">왼쪽의 내용을 입력하고 초안을 생성하세요.</div><button id="download" type="button" hidden>초안 JSON 다운로드</button></section></div><script>
const form=document.querySelector('#builder'),preview=document.querySelector('#preview'),download=document.querySelector('#download');let latest=null;const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);const csrf=()=>{const v=document.cookie.split('; ').find(x=>x.startsWith('apf_console_csrf='));return v?decodeURIComponent(v.split('=').slice(1).join('=')):''};form.addEventListener('submit',async event=>{event.preventDefault();const data=new FormData(form),body={slug:data.get('slug'),display_name:data.get('display_name'),introduction:data.get('introduction'),purpose_prompts:lines(data.get('purpose_prompts')),material_titles:lines(data.get('material_titles')),allow_call_request:data.has('allow_call_request')};try{const response=await fetch('/v1/console/call-templates/preview',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(JSON.stringify(result.detail||result));latest=result;preview.replaceChildren();const title=document.createElement('h3');title.textContent=result.display_name;preview.append(title);const intro=document.createElement('p');intro.textContent=result.introduction;preview.append(intro);for(const item of result.menus){const card=document.createElement('div');card.className='menu';card.textContent=item.title;preview.append(card)}const state=document.createElement('p');state.className='muted';state.textContent='초안 · 전화 미연결 · 공개 전';preview.append(state);const digest=document.createElement('p');digest.className='digest';digest.textContent=result.content_digest;preview.append(digest);download.hidden=false}catch(error){latest=null;download.hidden=true;preview.textContent='생성 실패: '+error.message}});download.addEventListener('click',()=>{if(!latest)return;const blob=new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='macol-'+latest.slug+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
