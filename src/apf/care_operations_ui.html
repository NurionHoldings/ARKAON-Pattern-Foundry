<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아르카온 | 해온 업무 프로그램 생성</title><style>body{font:16px/1.7 system-ui;background:#f9f7ef;color:#304638}main{max-width:1000px;margin:40px auto;padding:24px}section{padding:25px;background:white;border:1px solid #d8dfcf;border-radius:15px;margin:20px 0}label{display:block;margin:15px 0}input{padding:9px;font:inherit}button{padding:12px 20px;margin:7px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#304638}</style><main><a href="/console">← 운영 콘솔</a><h1>해온 업무 프로그램 생성</h1><p>업무 요구사항 검토 → 구성 확인 → 실행 가능한 HTML 미리보기 생성. 실제 운영 데이터·인증정보를 입력하지 마세요.</p><section><form id="brief"><label>시설명 <input name="brand" value="해온" maxlength="40" required></label><label>계획 정원 <input name="capacity" value="49" type="number" min="1" max="300" required></label><fieldset><legend>포함할 업무</legend><label><input type="checkbox" name="modules" value="office" checked> 사무·일정</label><label><input type="checkbox" name="modules" value="accounting" checked> 회계·증빙</label><label><input type="checkbox" name="modules" value="benefit" checked> 요양급여 검토 초안</label><label><input type="checkbox" name="modules" value="food_inventory" checked> 식자재 수불</label><label><input type="checkbox" name="modules" value="supplies_inventory" checked> 기타 재고</label></fieldset><button>구성·검증 규칙 확인</button></form></section><section><h2>생성 지식·검증 규칙</h2><pre id="output">아직 검토하지 않았습니다.</pre><label><input id="confirm" type="checkbox" disabled> 위 구성을 확인했습니다. 생성물은 서버 인증·지속 저장이 없는 동작 미리보기임을 확인합니다.</label><button id="generate" disabled>프로그램 생성</button><button id="download" disabled>생성한 HTML 내려받기</button><p id="status" role="status"></p></section></main><script>
const $=s=>document.querySelector(s);let brief=null,digest=null,artifact=null;function reset(){brief=digest=artifact=null;$('#confirm').checked=false;$('#confirm').disabled=true;$('#generate').disabled=true;$('#download').disabled=true;$('#output').textContent='구성이 변경되었습니다. 다시 검토하세요.'}$('#brief').addEventListener('input',reset);$('#confirm').onchange=()=>$('#generate').disabled=!$('#confirm').checked;
async function request(body){const csrf=document.cookie.split('; ').find(x=>x.startsWith('apf_console_csrf='))?.split('=')[1]||'';const r=await fetch('/v1/console/care-operations/program',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':decodeURIComponent(csrf)},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw Error(typeof result.detail==='string'?result.detail:'요청을 확인하세요.');return result}
$('#brief').onsubmit=async e=>{e.preventDefault();reset();const f=new FormData(e.target);brief={brand:f.get('brand'),capacity:Number(f.get('capacity')),floor:'3',modules:f.getAll('modules')};try{const r=await request(brief);digest=r.digest;$('#output').textContent=JSON.stringify(r,null,2);$('#confirm').disabled=false;$('#status').textContent='구성과 검증 규칙을 확인하세요.'}catch(e){$('#status').textContent=e.message}};
$('#generate').onclick=async()=>{if(!brief||!digest||!$('#confirm').checked)return;$('#generate').disabled=true;try{const r=await request({...brief,confirmed_digest:digest});artifact=r.artifact;$('#download').disabled=!artifact;$('#status').textContent=artifact?'프로그램을 생성했습니다. HTML 파일을 내려받아 브라우저에서 열 수 있습니다.':r.status}catch(e){$('#status').textContent=e.message}finally{$('#generate').disabled=!$('#confirm').checked}};
$('#download').onclick=()=>{if(!artifact)return;const url=URL.createObjectURL(new Blob([artifact.content],{type:artifact.media_type}));const a=document.createElement('a');a.href=url;a.download=artifact.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
