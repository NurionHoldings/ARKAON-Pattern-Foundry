<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이름@ | 내 소개 페이지</title><style>
:root{font-family:system-ui,sans-serif;color:#15243c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}
main{max-width:930px;margin:auto;padding:2rem 1rem 5rem}header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:clamp(2.4rem,7vw,4rem);margin:1.4rem 0 .3rem}h2{font-size:1.4rem}p{line-height:1.65}
.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:1rem}section{background:#fff;border:1px solid #d8e0ee;
border-radius:1rem;padding:1.4rem;margin-top:1rem}label{display:block;font-weight:650;margin:1rem 0 .35rem}
input,textarea,button{font:inherit;border-radius:.55rem;padding:.75rem;border:1px solid #aebbd0;width:100%}
textarea{min-height:8rem}button{cursor:pointer;background:#123b73;color:#fff;border:0;font-weight:700;margin-top:.8rem}
button:disabled{opacity:.5}button.secondary{background:#e8effa;color:#123b73}a{color:#174caa}
small{color:#455570}#message{min-height:2rem}#preview{white-space:pre-line;background:#edf4ff;padding:1rem;border-radius:.6rem}
@media(max-width:730px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><strong>이름@</strong><span>나를 보여주는 한 페이지</span></header>
<h1>이름@</h1><p>간단히 소개를 작성하고 사진과 영상을 더해 게시하세요.</p>
<div class="grid"><section><h2>계정</h2><label for="username">아이디</label><input id="username" autocomplete="username">
<label for="password">비밀번호 · 12자 이상</label><input id="password" type="password" autocomplete="current-password">
<button id="register" class="secondary">계정 만들기</button><button id="login">로그인</button>
<p><small>로그인 후 페이지를 작성할 수 있습니다.</small></p></section>
<section><h2>내 소개</h2><label for="displayName">표시 이름</label><input id="displayName" placeholder="예: 홍길동">
<label for="introduction">소개와 작업 내용</label><textarea id="introduction" placeholder="무슨 일을 하고 어떤 작업을 해왔는지 적어주세요."></textarea>
<label for="images">사진 · 최대 3장, 각 8MB</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple>
<label for="video">영상 · 1개, 최대 50MB</label><input id="video" type="file" accept="video/mp4,video/webm">
<button id="save">초안 저장</button><div id="preview" hidden></div><button id="publish" disabled>내용 확인 후 게시</button>
<p id="published"></p></section></div>
<section><h2>이름@로 찾기</h2><label for="query">검색어</label><input id="query" placeholder="홍길동@">
<button id="find" class="secondary">검색</button></section><p role="status" id="message"></p></main>
<script>
let csrf='',draft=null;
const $=id=>document.getElementById(id);
fetch('/name-at/session',{credentials:'same-origin'}).then(r=>r.ok?r.json():null)
 .then(data=>{if(data){csrf=data.csrf_token;message('로그인 상태입니다.')}}).catch(()=>{});
async function api(path,body,method='POST'){
 const headers={'X-CSRF-Token':csrf};if(!(body instanceof File))headers['Content-Type']='application/json';
 const response=await fetch(path,{method,credentials:'same-origin',headers,body:body instanceof File?body:JSON.stringify(body)});
 const value=await response.json();if(!response.ok)throw new Error(typeof value.detail==='string'?value.detail:'요청을 처리하지 못했습니다.');return value;
}
function message(text){$('message').textContent=text}
async function auth(path){try{const value=await api(path,{username:$('username').value,password:$('password').value});
 if(value.csrf_token)csrf=value.csrf_token;message(path.endsWith('login')?'로그인했습니다.':'계정을 만들었습니다. 로그인해 주세요.');}
 catch(error){message(error.message)}}
$('register').onclick=()=>auth('/name-at/register');$('login').onclick=()=>auth('/name-at/login');
$('save').onclick=async()=>{try{
 const selected=[...$('images').files];if(selected.length>3)throw new Error('사진은 최대 3장입니다.');
 const uploads=[];for(const file of selected)uploads.push(await api('/name-at/media',file));
 const video=$('video').files[0], videoUpload=video?await api('/name-at/media',video):null;
 const payload={display_name:$('displayName').value,introduction:$('introduction').value,
 image_ids:uploads.map(i=>i.id),image_descriptions:selected.map(i=>i.name),video_id:videoUpload?.id??null,
 video_description:video?.name??null};
 if(draft){payload.profile_id=draft.id;payload.expected_revision=draft.revision}
 draft=await api('/name-at/profiles',payload);$('preview').hidden=false;
 $('preview').textContent=`${payload.display_name}@\n\n${payload.introduction}\n사진 ${selected.length}장 · 영상 ${video?1:0}개`;
 $('publish').disabled=false;message('초안을 저장했습니다. 내용을 확인한 뒤 게시해 주세요.');
}catch(error){message(error.message)}};
$('publish').onclick=async()=>{try{if(!draft)return;
 const value=await api(`/name-at/profiles/${draft.id}/publish`,{expected_revision:draft.revision,approved_digest:draft.approval_digest});
 const link=document.createElement('a');link.href=value.url;link.textContent='게시된 페이지 보기';
 $('published').replaceChildren(link);$('publish').disabled=true;message('페이지를 게시했습니다. 검색 반영은 별도로 확인해야 합니다.');
}catch(error){message(error.message)}};
$('find').onclick=()=>{const q=$('query').value.trim();if(!q.endsWith('@')){message('이름 뒤에 @를 붙여 입력해 주세요.');return}
 location.href='/at/'+encodeURIComponent(q.slice(0,-1))};
</script></body></html>
