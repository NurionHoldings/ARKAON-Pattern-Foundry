<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참고자료 사용 확인</title><style>
:root{color-scheme:dark;background:#07111f;color:#edf4ff;font:16px system-ui;--panel:#101d2e;--line:#2b405a;--green:#42d392;--amber:#ffd166;--red:#ff7777}*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:1rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem;margin:1rem 0}label{display:block;margin:.8rem 0}input,textarea,select{width:100%;padding:.75rem;background:#07111f;color:#fff;border:1px solid var(--line);border-radius:8px}.checks label{display:flex;gap:.65rem;align-items:flex-start}.checks input{width:auto;margin-top:.25rem}.notice{border-left:5px solid var(--amber);padding:1rem;background:#2a2314;line-height:1.6}.boundary{color:var(--amber)}button{width:100%;min-height:50px;padding:.8rem;background:#147a50;color:#fff;border:1px solid var(--green);border-radius:10px;font-weight:700}button:disabled{background:#374554;border-color:#566677;color:#aab4bf}.result{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--red)}@media(max-width:600px){body{padding:.6rem}}
</style></head><body><header><h1>참고자료 사용 확인</h1><p>참고자료의 사용 범위와 책임 고지를 확인한 뒤 sandbox 작업을 요청합니다.</p></header><main><section class="card"><h2>중요 고지</h2><p id="notice" class="notice">고지문을 불러오는 중입니다.</p><p class="boundary">이 확인은 자동 병합이나 운영 배포를 승인하지 않습니다.</p></section><form id="form" class="card"><h2>자료와 사용 범위</h2><label>요청 ID<input id="requestId" required pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}"></label><label>자료 식별자<input id="sourceId" required></label><label>공식 출처 또는 자료 위치<input id="sourceLocator" required></label><label>사용 목적<textarea id="intendedUse" required minlength="10"></textarea></label><label>사용 방식<select id="mode"><option value="PRINCIPLE_REFERENCE">기능·아이디어만 참고</option><option value="CLEAN_ROOM_IMPLEMENTATION">원본 표현 없는 독립 구현</option><option value="DIRECT_REUSE">권리 증거에 따른 직접 재사용</option></select></label><label>권리 근거<select id="rightsBasis"><option value="UNKNOWN">확인되지 않음</option><option value="USER_OWNED">사용자 소유</option><option value="EXPLICIT_PERMISSION">명시적 허가</option><option value="LICENSED">라이선스</option><option value="PUBLIC_DOMAIN">퍼블릭 도메인</option></select></label><label>권리 증거 digest(직접 재사용 시 필수)<input id="rightsDigest" placeholder="sha256:..."></label><label>허용 경로(한 줄에 하나)<textarea id="paths" required></textarea></label><label>승인 scope digest<input id="scopeDigest" required pattern="sha256:[0-9a-f]{64}"></label><h2>이해 확인</h2><div id="checks" class="checks"></div><button id="submit" disabled>모두 이해하고 sandbox 요청 기록</button></form><section class="card"><h2>처리 결과</h2><p id="result" class="result">아직 제출하지 않았습니다.</p></section></main><script>
const labels={USER_REQUESTED_SPECIFIC_USE:'내가 이 자료의 구체적인 사용을 요청했습니다.',USER_RESPONSIBLE_FOR_MATERIAL_AND_RIGHTS_CLAIM:'내가 제공한 자료와 권리 주장의 정확성에 관한 귀책 책임을 이해합니다.',CONSENT_DOES_NOT_MAKE_UNAUTHORIZED_USE_LAWFUL:'이 확인만으로 허가되지 않은 이용이 적법해지는 것은 아님을 이해합니다.',PLATFORM_MAY_REFUSE_OR_QUARANTINE:'침해 가능성이 높은 요청은 거절·격리될 수 있음을 이해합니다.',MERGE_AND_DEPLOYMENT_NOT_AUTHORIZED:'이 확인은 병합·운영 배포 승인이 아님을 이해합니다.'};let required=[];const csrf=()=>{const x=document.cookie.split('; ').find(v=>v.startsWith('apf_console_csrf='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):''};const lines=id=>document.querySelector(id).value.split('\n').map(x=>x.trim()).filter(Boolean);async function api(url,options={}){options.headers={...(options.headers||{}),'X-CSRF-Token':csrf()};const r=await fetch(url,options),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||'요청 실패');return b}function selected(){return [...document.querySelectorAll('#checks input:checked')].map(x=>x.value)}function refresh(){document.querySelector('#submit').disabled=selected().length!==required.length}async function init(){const n=await api('/v1/console/reference-material-notice');document.querySelector('#notice').textContent=n.notice_text;required=n.required_acknowledgements;const root=document.querySelector('#checks');for(const id of required){const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.value=id;input.addEventListener('change',refresh);span.textContent=labels[id]||id;label.append(input,span);root.append(label)}}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const rights=document.querySelector('#rightsDigest').value.trim();const body={request:{request_id:document.querySelector('#requestId').value,source_id:document.querySelector('#sourceId').value,source_locator:document.querySelector('#sourceLocator').value,intended_use:document.querySelector('#intendedUse').value,mode:document.querySelector('#mode').value,rights_basis:document.querySelector('#rightsBasis').value,rights_evidence_digest:rights||null,requested_paths:lines('#paths'),scope_digest:document.querySelector('#scopeDigest').value},acknowledged_items:selected(),nonce:crypto.randomUUID()};const out=document.querySelector('#result');try{const r=await api('/v1/console/reference-material-consents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});out.className='result';out.textContent=`판정: ${r.decision.decision}\n사유: ${r.decision.reason}\nreceipt: ${r.receipt_digest}\n병합·배포: 승인되지 않음`}catch(err){out.className='result error';out.textContent=err.message}});init().catch(e=>{document.querySelector('#result').className='result error';document.querySelector('#result').textContent=e.message});
</script></body></html>
