<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 이해·승인</title><style>
:root{color-scheme:dark;background:#07111f;color:#edf4ff;font:16px system-ui;--line:#2b405a;--panel:#101d2e;--blue:#53adff;--green:#42d392;--amber:#ffd166;--red:#ff7777}*{box-sizing:border-box}body{margin:auto;max-width:1120px;padding:1.5rem}header{display:flex;justify-content:space-between;gap:1rem;align-items:center}.badge{background:#3b2e13;color:#ffd77a;padding:.4rem .75rem;border-radius:99px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem}.wide{grid-column:1/-1}.muted{color:#adbed2}.report{display:grid;grid-template-columns:280px 1fr;gap:1rem}.report-list button{display:block;width:100%;margin:.5rem 0;text-align:left}.visual{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.flow{background:#081523;border:1px solid var(--line);border-radius:12px;padding:.8rem}.step{background:#172b42;border-left:4px solid var(--blue);padding:.65rem;margin:.45rem 0;border-radius:7px}.after .step{border-color:var(--green)}button{background:#24415f;color:#fff;border:1px solid #40658b;padding:.7rem 1rem;border-radius:9px;cursor:pointer}.approve{background:#147a50;border-color:#42d392}.hold{background:#6e5515;border-color:#ffd166}.reject{background:#702f38;border-color:#ff7777}.actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}.scope{font:13px ui-monospace;overflow-wrap:anywhere;color:#9ed5ff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.6rem;border-bottom:1px solid var(--line)}@media(max-width:760px){body{padding:.8rem}main{grid-template-columns:1fr}.report{grid-template-columns:1fr}.visual{grid-template-columns:1fr}.actions button{flex:1;min-height:48px}}
</style></head><body><header><div><h1>ARKAON 이해·승인</h1><p class="muted">쉬운 설명과 전후 그림을 확인한 뒤 결정합니다.</p></div><div><a href="/site-drafts">웹사이트 초안</a> · <a href="/logo-drafts">SVG 로고 시안</a> · <a href="/business-cards">명함 만들기</a> · <a href="/platform-dialogue">플랫폼 설계 대화</a> · <a href="/format-proposals">형식 시안 미리보기</a> · <a href="/console/railway-setup">현재 결과물·운영 준비</a> <span class="badge" id="status">불러오는 중</span></div></header><main><section class="card"><h2>등록 대상</h2><strong id="targets">–</strong></section><section class="card"><h2>열린 검토</h2><strong id="reviews">–</strong></section><section class="card"><h2>자산 후보</h2><strong id="candidates">–</strong></section><section class="card wide report"><nav class="report-list"><h2>개선 요청</h2><div id="reportList"><p class="muted">승인 권한이 있는 사용자에게만 표시됩니다.</p></div></nav><article id="reportDetail"><h2>요청을 선택하세요</h2><p class="muted">승인 전 문제, 개선 내용, 위험과 되돌리기 방법을 모두 확인하세요.</p></article></section><section class="card wide"><h2>안전 잠금</h2><div id="locks"></div></section><section class="card wide"><h2>대상 목록</h2><table><thead><tr><th>이름</th><th>유형</th><th>상태</th><th>증거</th></tr></thead><tbody id="targetRows"></tbody></table></section></main><script>
const clean=v=>String(v);const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=clean(text);if(cls)n.className=cls;return n};
function csrf(){const hit=document.cookie.split('; ').find(v=>v.startsWith('apf_console_csrf='));return hit?decodeURIComponent(hit.split('=').slice(1).join('=')):''}
function flow(title,steps,cls){const box=el('div',undefined,`flow ${cls}`);box.append(el('h3',title));for(const value of steps)box.append(el('div',value,'step'));return box}
async function decide(report,decision){if(!confirm(`${decision==='APPROVE'?'이 범위의 구현을 승인':'이 요청을 처리'}하시겠습니까?\n\n자동 병합과 운영 배포는 허용되지 않습니다.`))return;const payload={decision,scope_digest:report.scope_digest,nonce:crypto.randomUUID(),expires_at:new Date(Date.now()+10*60*1000).toISOString()};const response=await fetch(`/v1/console/self-improvement-reports/${encodeURIComponent(report.request_id)}/decision`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw Error(body.detail||'결정 저장 실패');document.querySelector('#status').textContent=`${decision} 기록 완료`;document.querySelector('.actions').replaceChildren(el('strong',`결정이 기록되었습니다 · ${body.receipt_digest}`,'scope'))}
function render(report){const p=report.plain_language,root=document.querySelector('#reportDetail');root.replaceChildren();root.append(el('h2',p.title),el('p',`위험도: ${report.risk_level}`,'badge'),el('h3','현재 문제'),el('p',p.problem),el('h3','무엇이 바뀌나요?'),el('p',p.change),el('h3','어떻게 나아지나요?'),el('p',p.benefit));const visual=el('div',undefined,'visual');visual.append(flow('변경 전',p.visual.before,'before'),flow('변경 후',p.visual.after,'after'));root.append(visual,el('h3','사용자 영향'),el('p',p.impact),el('h3','주의할 점'));const ul=el('ul');for(const risk of p.risks)ul.append(el('li',risk));root.append(ul,el('h3','되돌리는 방법'),el('p',p.rollback));const scope=el('details');scope.append(el('summary','승인되는 기술 범위 보기'));scope.append(el('p',`허용 경로: ${report.approval_scope.allowed_paths.join(', ')}`,'scope'),el('p',`허용 작업: ${report.approval_scope.allowed_operations.join(', ')}`,'scope'),el('p',`범위 digest: ${report.scope_digest}`,'scope'),el('p','자동 병합: 금지 · 운영 배포: 금지','scope'));root.append(scope);const actions=el('div',undefined,'actions');for(const [value,label,cls] of [['REJECT','거절','reject'],['HOLD','보류','hold'],['APPROVE','승인','approve']]){const b=el('button',label,cls);b.addEventListener('click',()=>decide(report,value).catch(e=>alert(e.message)));actions.append(b)}root.append(actions)}
async function loadReports(){const response=await fetch('/v1/console/self-improvement-reports');if(response.status===403)return;if(!response.ok)throw Error('개선 요청을 불러오지 못했습니다');const reports=await response.json(),list=document.querySelector('#reportList');list.replaceChildren();for(const item of reports){const b=el('button',`${item.title} · 위험 ${item.risk_level}`);b.addEventListener('click',async()=>{const r=await fetch(`/v1/console/self-improvement-reports/${encodeURIComponent(item.request_id)}`);if(!r.ok)throw Error('보고서 검증 실패');render(await r.json())});list.append(b)}if(!reports.length)list.append(el('p','대기 중인 요청이 없습니다.','muted'))}
async function load(){const [s,t]=await Promise.all([fetch('/v1/console/summary'),fetch('/v1/console/targets')]);if(!s.ok||!t.ok)throw Error('권한 확인 실패');const summary=await s.json(),targets=await t.json();document.querySelector('#status').textContent=summary.readiness.overall_status;document.querySelector('#targets').textContent=summary.counts.targets;document.querySelector('#reviews').textContent=summary.counts.open_reviews;document.querySelector('#candidates').textContent=summary.counts.asset_candidates;const locks=document.querySelector('#locks');for(const [k,v] of Object.entries(summary.readiness.locks))locks.append(el('p',`${k}: ${v?'허용':'잠금'}`));const rows=document.querySelector('#targetRows');for(const item of targets){const tr=el('tr');for(const v of [item.name,item.type,item.state,item.evidence_count])tr.append(el('td',v));rows.append(tr)}await loadReports()}load().catch(e=>{document.querySelector('#status').textContent=e.message});
</script></body></html>
