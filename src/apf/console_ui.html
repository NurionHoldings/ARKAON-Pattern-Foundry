<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKAON 검토 콘솔</title><style>
:root{color-scheme:dark;background:#08111f;color:#e8eef7;font:16px system-ui}body{margin:auto;max-width:1100px;padding:2rem}header{display:flex;justify-content:space-between;gap:1rem;align-items:center}.badge{background:#3b2e13;color:#ffd77a;padding:.4rem .7rem;border-radius:99px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.card{background:#111d2e;border:1px solid #2b3b52;border-radius:14px;padding:1rem}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #2b3b52}button{background:#46a4ff;color:#06101d;border:0;padding:.65rem 1rem;border-radius:8px}code{overflow-wrap:anywhere;color:#8bd3ff}.muted{color:#a9b6c8}@media(max-width:600px){body{padding:1rem}table{font-size:.85rem}}
</style></head><body><header><div><h1>ARKAON 검토 콘솔</h1><p class="muted">원문과 비밀정보를 표시하지 않는 운영 보기</p></div><span class="badge" id="status">불러오는 중</span></header><main><section class="card"><h2>등록 대상</h2><strong id="targets">–</strong></section><section class="card"><h2>열린 검토</h2><strong id="reviews">–</strong></section><section class="card"><h2>자산 후보</h2><strong id="candidates">–</strong></section><section class="card wide"><h2>안전 잠금</h2><div id="locks"></div></section><section class="card wide"><h2>대상 목록</h2><table><thead><tr><th>이름</th><th>유형</th><th>상태</th><th>증거</th></tr></thead><tbody id="targetRows"></tbody></table></section><section class="card wide"><h2>외부 검토</h2><p>승인·거부는 에테르니언의 서명된 증명 검증 후에만 반영됩니다. 이 화면은 상태를 직접 변경하지 않습니다.</p></section></main><script>
const clean=s=>String(s);async function load(){const [s,t]=await Promise.all([fetch('/v1/console/summary'),fetch('/v1/console/targets')]);if(!s.ok||!t.ok)throw Error('권한 확인 실패');const summary=await s.json(),targets=await t.json();document.querySelector('#status').textContent=summary.readiness.overall_status;document.querySelector('#targets').textContent=summary.counts.targets;document.querySelector('#reviews').textContent=summary.counts.open_reviews;document.querySelector('#candidates').textContent=summary.counts.asset_candidates;const locks=document.querySelector('#locks');for(const [k,v] of Object.entries(summary.readiness.locks)){const p=document.createElement('p');p.textContent=`${clean(k)}: ${v?'허용':'잠금'}`;locks.append(p)}const rows=document.querySelector('#targetRows');for(const item of targets){const tr=document.createElement('tr');for(const v of [item.name,item.type,item.state,item.evidence_count]){const td=document.createElement('td');td.textContent=clean(v);tr.append(td)}rows.append(tr)}}load().catch(e=>{document.querySelector('#status').textContent=e.message});
</script></body></html>
