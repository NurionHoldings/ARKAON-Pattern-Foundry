name: Production Readiness Gate
on:
  pull_request:
    paths:
      - 'ops/production-readiness.json'
      - 'scripts/check_production_readiness.py'
      - '.github/workflows/production-readiness.yml'
  workflow_dispatch:
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm production remains blocked until all evidence is verified
        run: |
          if python scripts/check_production_readiness.py; then
            echo "All declared gates satisfied; manual approval still required."
          else
            echo "Production release blocked as designed; this is not a CI failure."
          fi
