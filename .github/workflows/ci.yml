name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apf
          POSTGRES_PASSWORD: apf_test_only
          POSTGRES_DB: apf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apf -d apf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://apf:apf_test_only@localhost:5432/apf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_postgres_repository.py
  windows-audit-controls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: >-
          pytest -q
          tests/test_arkaon_audit_bot.py
          tests/test_audit_bot_learning.py
          tests/test_audit_bot_runtime.py
          tests/test_audit_bot_internal.py
          tests/test_self_improvement_execution.py
          tests/test_self_improvement_relay.py
      - shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw orchestrator/manage-audit-baseline.ps1))
          [void][scriptblock]::Create((Get-Content -Raw orchestrator/audit-bot-preflight.ps1))
          [void][scriptblock]::Create((Get-Content -Raw orchestrator/audit-bot-smoke.ps1))
