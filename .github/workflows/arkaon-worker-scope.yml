name: ARKAON worker scope
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read the guard from the trusted default branch, never PR code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify approved task scope without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/guard_github_worker.py
