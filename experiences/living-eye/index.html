<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b17">
<title>ARKAON | 공존의 눈</title><style>
:root{color-scheme:dark;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#050b17;color:#e7f5ff}main{min-height:100svh;display:grid;place-items:center;padding:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#173452,#050b17 70%);position:relative}
.scene{width:min(95vw,850px);display:grid;justify-items:center;gap:14px;position:relative;isolation:isolate}.eye{width:min(90vw,690px);aspect-ratio:2.5;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 24px #2e9fdd55);animation:float 7s ease-in-out infinite}
.eye::before,.eye::after{content:"";position:absolute;inset:15% 0;border:2px solid #9ad9f0;border-radius:65% 0;transform:rotate(45deg);box-shadow:0 0 22px #5abcf477,inset 0 0 22px #2f8bc755}
.eye::after{inset:22% 4%;border-color:#d8b882;opacity:.55;transform:rotate(-45deg);animation:glimmer 6s ease-in-out infinite}
.iris{position:relative;width:clamp(115px,23vw,225px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 15deg,#356c9d 0deg,#81cde6 5deg,#b88a58 8deg,#142c49 12deg);box-shadow:0 0 0 12px #0c1c2bbb,0 0 32px #7bd9f977,inset 0 0 25px #050b17;animation:iris-breathe 5s ease-in-out infinite;overflow:hidden}
.iris::before{content:"";position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 36% 28%,#4b6a84 0 5%,#03070e 18% 100%);box-shadow:0 0 0 8px #132b40a8}
.iris::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff4a,transparent 30%,transparent 70%,#5cd8ff22);border-radius:50%}
.orbit{position:absolute;width:92%;height:110%;border:1px solid #9ecae96e;border-radius:50%;transform:rotate(-17deg);animation:orbit 25s linear infinite;pointer-events:none}
.orbit:nth-child(2){width:104%;height:90%;transform:rotate(14deg);animation-duration:31s;animation-direction:reverse;border-color:#dfb98080}
.chip{position:absolute;right:12%;top:40%;padding:9px;border:1px solid #7cdbff;border-radius:4px;font-size:.8rem;letter-spacing:.15em;color:#a8eaff;box-shadow:0 0 15px #47c8ff66}
h1{margin:0;font-size:clamp(2.2rem,7vw,5.5rem);letter-spacing:.17em;font-weight:650;text-align:center}p{margin:0;color:#a9c5db;text-align:center;line-height:1.7}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
button{background:#16364f;color:#f2fbff;border:1px solid #5aafd0;border-radius:999px;padding:12px 22px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
main.awake .iris{animation-duration:2s;filter:saturate(1.5) brightness(1.2)}main.awake .eye{filter:drop-shadow(0 0 48px #52baf0bb)}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes iris-breathe{50%{transform:scale(.96);filter:brightness(1.15)}}@keyframes glimmer{50%{opacity:.95}}@keyframes orbit{to{transform:rotate(343deg)}}
@media(max-width:600px){.chip{right:5%;top:20%;font-size:.65rem}.eye{aspect-ratio:1.8}.orbit{height:75%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main id="stage"><div class="scene"><div class="eye" role="img" aria-label="인간의 홍채와 인공지능 회로를 상징하는 아르카온의 눈"><div class="orbit"></div><div class="orbit"></div><div class="iris"></div><span class="chip">AI</span></div><h1>ARKAON</h1><p>인간의 감각과 인공지능의 가능성이 만나는 곳</p><div class="actions"><button id="wake" type="button" aria-pressed="false">아르카온 깨우기</button><button id="motion" type="button" aria-pressed="false">움직임 끄기</button><button id="enter" type="button">서비스 홈으로</button></div></div></main>
<script>
(()=>{'use strict';const stage=document.getElementById('stage'),wake=document.getElementById('wake'),motion=document.getElementById('motion');let awake=false,paused=false;wake.addEventListener('click',()=>{awake=!awake;stage.classList.toggle('awake',awake);wake.setAttribute('aria-pressed',String(awake));wake.textContent=awake?'휴식 모드로':'아르카온 깨우기'});motion.addEventListener('click',()=>{paused=!paused;stage.style.setProperty('--paused',paused?'paused':'running');document.querySelectorAll('.eye,.iris,.orbit').forEach(el=>el.style.animationPlayState=paused?'paused':'running');motion.textContent=paused?'움직임 켜기':'움직임 끄기';motion.setAttribute('aria-pressed',String(paused))});document.getElementById('enter').addEventListener('click',()=>{location.assign('/')})})();
</script></body></html>
